<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StudyThread — Aprofundamento</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>



<style>
:root {
  --ink:#2c2418;
  --paper:#fefaf5;
  --aged:#f5efe6;
  --sepia:#d4c5b0;
  --rust:#c45a3a;
  --gold:#d4a52a;
  --sage:#5a7a4a;
  --slate:#4a5a6a;
  --ghost:#9a8a7a;
  --margin:#e8dfd3;
  --border-light:#e2d8cc;
  --bg-side:#faf6f0;
  --card-bg:#ffffff;
  --font-d:'Playfair Display',Georgia,serif;
  --font-b:'Crimson Pro','Times New Roman',serif;
  --font-m:'DM Mono','Courier New',monospace;
  --r:8px;
  --sidebar:340px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-b);font-size:17px;line-height:1.7;color:var(--ink);background:var(--paper);}

#layout{display:grid;grid-template-columns:1fr var(--sidebar);grid-template-rows:56px 1fr;height:100vh;}

/* ── TOPBAR ── */
#topbar{
  grid-column:1/-1;
  background:var(--paper);
  border-bottom:1px solid var(--border-light);
  display:flex;
  align-items:center;
  gap:16px;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:30;
  box-shadow:var(--shadow-sm);
}
.topbar-back{
  background:transparent;
  border:1px solid var(--border-light);
  color:var(--ghost);
  font-family:var(--font-m);
  font-size:.7rem;
  padding:6px 14px;
  border-radius:var(--r);
  cursor:pointer;
  transition:all .2s;
  text-transform:uppercase;
  letter-spacing:.08em;
}
.topbar-back:hover{background:var(--gold);color:var(--paper);border-color:var(--gold);}
.topbar-title{font-family:var(--font-d);font-size:1.2rem;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-title span{color:var(--gold);font-style:italic;}
.topbar-badge{
  font-family:var(--font-m);
  font-size:.65rem;
  padding:4px 12px;
  border-radius:20px;
  background:rgba(212,165,42,.12);
  color:var(--gold);
  border:1px solid rgba(212,165,42,.25);
  white-space:nowrap;
}
.topbar-actions{display:flex;gap:10px;}
.btn{
  font-family:var(--font-m);
  font-size:.68rem;
  letter-spacing:.07em;
  padding:6px 14px;
  border-radius:var(--r);
  border:none;
  cursor:pointer;
  transition:all .2s;
  text-transform:uppercase;
  font-weight:500;
}
.btn-gold{background:var(--gold);color:var(--paper);}
.btn-gold:hover{background:#c4952a;transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--border-light);color:var(--ghost);}
.btn-ghost:hover{background:rgba(212,165,42,.1);border-color:var(--gold);color:var(--gold);}
.btn-sage{background:var(--sage);color:var(--paper);}
.btn-sage:hover{background:#4a6a3a;transform:translateY(-1px);}

/* ── MAIN EDITOR ── */
#editor-col{
  overflow-y:auto;
  background:var(--paper);
}

/* Post origin card */
#post-origem{
  background:linear-gradient(135deg, var(--aged) 0%, var(--paper) 100%);
  border-bottom:1px solid var(--border-light);
  padding:32px 48px;
  position:relative;
}
.origem-label{
  font-family:var(--font-m);
  font-size:.65rem;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:12px;
}
.origem-conteudo{
  font-family:var(--font-d);
  font-size:1.4rem;
  line-height:1.6;
  color:var(--ink);
  font-style:italic;
  margin-bottom:16px;
}
.origem-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.origem-autor{display:flex;align-items:center;gap:8px;font-family:var(--font-m);font-size:.75rem;color:var(--ghost);}
.origem-dot{
  width:28px;
  height:28px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  background:var(--gold);
  color:white;
}
.origem-tags{display:flex;gap:8px;flex-wrap:wrap;}
.origem-tag{
  font-family:var(--font-m);
  font-size:.6rem;
  padding:3px 10px;
  border-radius:20px;
  background:rgba(212,165,42,.1);
  color:var(--gold);
  border:1px solid rgba(212,165,42,.2);
}

/* Notion-like editor area */
#notion-editor{
  max-width:800px;
  margin:0 auto;
  padding:48px 48px 120px;
  min-height:calc(100vh - 280px);
}

/* Toolbar flutuante */
#toolbar{
  display:flex;
  gap:6px;
  align-items:center;
  background:var(--paper);
  border:1px solid var(--border-light);
  border-radius:12px;
  padding:8px 12px;
  box-shadow:var(--shadow-md);
  position:fixed;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  flex-wrap:wrap;
  max-width:560px;
}
#toolbar.visible{opacity:1;pointer-events:all;}
.tb-btn{
  background:transparent;
  border:none;
  color:var(--ghost);
  font-size:.85rem;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-family:var(--font-m);
  transition:all .12s;
  white-space:nowrap;
}
.tb-btn:hover{background:rgba(212,165,42,.1);color:var(--gold);}
.tb-sep{width:1px;height:20px;background:var(--border-light);margin:0 4px;}

/* Blocos */
.notion-block{
  position:relative;
  margin:4px 0;
  border-radius:8px;
  transition:background .15s;
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.notion-block:hover{background:rgba(212,165,42,.04);}
.notion-block:hover .block-handle{opacity:1;}

.block-handle{
  opacity:0;
  cursor:grab;
  color:var(--margin);
  font-size:.9rem;
  padding:6px 4px;
  margin-top:4px;
  flex-shrink:0;
  transition:opacity .15s;
  width:24px;
  text-align:center;
  user-select:none;
  border-radius:4px;
}
.block-handle:hover{background:rgba(212,165,42,.1);color:var(--gold);}
.block-handle:active{cursor:grabbing;}

.block-content{flex:1;min-width:0;outline:none;}

/* Tipos de bloco */
.block-p{
  font-family:var(--font-b);
  font-size:1rem;
  line-height:1.75;
  color:var(--ink);
  padding:6px 0;
}
.block-p:empty::before{
  content:attr(data-ph);
  color:var(--margin);
  pointer-events:none;
}

.block-h1{
  font-family:var(--font-d);
  font-size:2rem;
  font-weight:700;
  line-height:1.3;
  color:var(--ink);
  padding:16px 0 8px;
  border-bottom:2px solid var(--gold);
  margin-bottom:8px;
}
.block-h1:empty::before{
  content:'Título';
  color:var(--margin);
  pointer-events:none;
}

.block-h2{
  font-family:var(--font-d);
  font-size:1.5rem;
  font-weight:700;
  line-height:1.4;
  color:var(--ink);
  padding:12px 0 6px;
}
.block-h2:empty::before{
  content:'Subtítulo';
  color:var(--margin);
  pointer-events:none;
}

.block-h3{
  font-family:var(--font-d);
  font-size:1.15rem;
  font-weight:600;
  line-height:1.4;
  color:var(--slate);
  padding:10px 0 4px;
}
.block-h3:empty::before{
  content:'Seção';
  color:var(--margin);
  pointer-events:none;
}

.block-bullet{
  font-family:var(--font-b);
  font-size:1rem;
  line-height:1.65;
  color:var(--ink);
  padding:6px 0 6px 24px;
  position:relative;
}
.block-bullet::before{
  content:'•';
  position:absolute;
  left:6px;
  color:var(--gold);
  font-size:1.2rem;
}
.block-bullet:empty::before{
  content:'• Item da lista';
  left:6px;
  color:var(--margin);
}

.block-num{
  font-family:var(--font-b);
  font-size:1rem;
  line-height:1.65;
  color:var(--ink);
  padding:6px 0 6px 32px;
  position:relative;
}
.block-num:empty::before{
  content:'Item numerado';
  color:var(--margin);
}

.block-quote{
  font-family:var(--font-d);
  font-size:1.05rem;
  font-style:italic;
  line-height:1.7;
  color:var(--slate);
  border-left:4px solid var(--gold);
  padding:12px 20px;
  margin:12px 0;
  background:rgba(212,165,42,.05);
  border-radius:0 8px 8px 0;
}
.block-quote:empty::before{
  content:'"Citação ou destaque…"';
  color:var(--margin);
}

.block-callout{
  background:rgba(212,165,42,.08);
  border:1px solid rgba(212,165,42,.2);
  border-radius:10px;
  padding:14px 18px;
  margin:12px 0;
  font-family:var(--font-b);
  font-size:.95rem;
  line-height:1.65;
}
.block-callout:empty::before{
  content:'💡 Nota importante…';
  color:var(--margin);
}

.block-divider{
  border:none;
  border-top:2px dashed var(--border-light);
  margin:24px 0;
  pointer-events:none;
}

.block-code{
  font-family:var(--font-m);
  font-size:.85rem;
  background:#f5f0ea;
  color:var(--rust);
  padding:14px 18px;
  border-radius:10px;
  margin:12px 0;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-all;
  border:1px solid var(--border-light);
}
.block-code:empty::before{
  content:'// Código…';
  color:var(--ghost);
}

/* Embed YouTube */
.block-youtube{margin:16px 0;}
.youtube-input-wrap{display:flex;gap:10px;align-items:center;}
.youtube-input-wrap input{
  flex:1;
  background:var(--paper);
  border:1px solid var(--border-light);
  border-radius:var(--r);
  padding:10px 14px;
  font-family:var(--font-m);
  font-size:.8rem;
  color:var(--ink);
  outline:none;
  transition:border-color .2s;
}
.youtube-input-wrap input:focus{border-color:var(--gold);}
.youtube-embed{
  position:relative;
  padding-bottom:56.25%;
  height:0;
  overflow:hidden;
  border-radius:12px;
  background:#f0ebe0;
  margin-top:10px;
}
.youtube-embed iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:none;
  border-radius:12px;
}
.youtube-label{
  font-family:var(--font-m);
  font-size:.65rem;
  color:var(--ghost);
  margin-bottom:8px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

/* Embed link */
.block-link{
  border:1px solid var(--border-light);
  border-radius:10px;
  padding:14px 18px;
  margin:12px 0;
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--paper);
  text-decoration:none;
  transition:all .2s;
}
.block-link:hover{
  border-color:var(--gold);
  box-shadow:var(--shadow-sm);
}
.link-icon{font-size:1.3rem;flex-shrink:0;}
.link-info{flex:1;min-width:0;}
.link-url{
  font-family:var(--font-m);
  font-size:.7rem;
  color:var(--ghost);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.link-title{
  font-family:var(--font-b);
  font-size:.95rem;
  color:var(--ink);
  margin-bottom:4px;
}

/* Slash menu */
#slash-menu{
  position:fixed;
  z-index:200;
  background:var(--paper);
  border:1px solid var(--border-light);
  border-radius:12px;
  box-shadow:var(--shadow-md);
  min-width:260px;
  max-height:360px;
  overflow-y:auto;
  display:none;
}
#slash-menu.open{display:block;}
.slash-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 16px;
  cursor:pointer;
  font-family:var(--font-b);
  font-size:.9rem;
  color:var(--ink);
  transition:background .1s;
}
.slash-item:hover,.slash-item.active{background:rgba(212,165,42,.08);}
.slash-icon{font-size:1rem;width:28px;text-align:center;flex-shrink:0;}
.slash-label{flex:1;}
.slash-hint{font-family:var(--font-m);font-size:.65rem;color:var(--ghost);}

/* Bloco selecionado */
.notion-block.selected{
  background:rgba(212,165,42,.08);
  border-radius:8px;
}

/* ── SIDEBAR ── */
#sidebar-col{
  background:var(--bg-side);
  border-left:1px solid var(--border-light);
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}
.sidebar-head{
  padding:20px 20px;
  background:var(--bg-side);
  border-bottom:1px solid var(--border-light);
  position:sticky;
  top:0;
  z-index:2;
  flex-shrink:0;
}
.sidebar-tabs{
  display:flex;
  gap:0;
  border-bottom:1px solid var(--border-light);
  flex-shrink:0;
  background:var(--bg-side);
}
.stab{
  flex:1;
  background:transparent;
  border:none;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  padding:12px 8px;
  font-family:var(--font-m);
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ghost);
  cursor:pointer;
  transition:all .15s;
}
.stab:hover{color:var(--gold);}
.stab.active{
  color:var(--gold);
  border-bottom-color:var(--gold);
}

.sidebar-body{
  flex:1;
  overflow-y:auto;
  padding:16px;
  padding-bottom: 32px;
}

/* Comentários na sidebar */
.sc-node{margin-bottom:12px;}
.sc-node.nested{margin-left:16px;border-left:2px solid var(--border-light);padding-left:12px;}
.sc-bubble{
  background:var(--card-bg);
  border:1px solid var(--border-light);
  border-radius:10px;
  overflow:hidden;
}
.sc-head{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:var(--bg-side);
  border-bottom:1px solid var(--border-light);
  flex-wrap:wrap;
}
.sc-autor{
  font-family:var(--font-m);
  font-size:.7rem;
  font-weight:600;
  color:var(--ink);
  flex:1;
}
.sc-tipo{
  font-family:var(--font-m);
  font-size:.55rem;
  padding:2px 8px;
  border-radius:12px;
  text-transform:uppercase;
  background:rgba(212,165,42,.1);
  color:var(--gold);
}
.sc-body{
  padding:12px;
  font-size:.88rem;
  color:var(--ink);
  line-height:1.6;
  font-family:var(--font-b);
}
.sc-body a{
  color:var(--gold);
  text-decoration:underline;
}
.sc-ts{
  font-family:var(--font-m);
  font-size:.55rem;
  color:var(--ghost);
  padding:6px 12px;
  border-top:1px solid var(--border-light);
}
.sc-empty{
  color:var(--ghost);
  font-family:var(--font-d);
  font-style:italic;
  font-size:.85rem;
  padding:24px 0;
  text-align:center;
}

/* Status bar */
#status-bar{
  position:fixed;
  bottom:12px;
  left:12px;
  right:auto;
  background:var(--ink);
  border-radius:40px;
  padding:6px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--font-m);
  font-size:.65rem;
  color:var(--sepia);
  z-index:20;
  pointer-events:none;
  box-shadow:var(--shadow-md);
  width:auto;
}
.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--sage);
}
.status-dot.saving{
  background:var(--gold);
  animation:pulse 1s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* Scrollbars */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}

/* Link block input */
.link-block-input{display:flex;gap:8px;align-items:center;}
.link-block-input input{
  flex:1;
  background:var(--paper);
  border:1px solid var(--border-light);
  border-radius:var(--r);
  padding:10px 12px;
  font-family:var(--font-m);
  font-size:.78rem;
  color:var(--ink);
  outline:none;
}
.link-block-input input:focus{border-color:var(--gold);}

/* Drag */
.notion-block.dragging{opacity:.4;}
.notion-block.drag-over{border-top:2px solid var(--gold);padding-top:4px;}

/* Nota item */
.nota-item{
  background:var(--card-bg);
  border:1px solid var(--border-light);
  border-radius:10px;
  padding:12px;
  transition:all .2s;
}
.nota-item:hover{
  border-color:var(--gold);
  box-shadow:var(--shadow-sm);
}
#nota-composer textarea{
  width:100%;
  min-height:80px;
  background:var(--card-bg);
  border:1px solid var(--border-light);
  border-radius:10px;
  padding:10px 12px;
  font-family:var(--font-b);
  font-size:.9rem;
  color:var(--ink);
  resize:vertical;
  outline:none;
  transition:border-color .2s;
}
#nota-composer textarea:focus{
  border-color:var(--gold);
}
#nota-composer button{
  width:100%;
  margin-top:8px;
  background:var(--gold);
  color:var(--paper);
  border:none;
  border-radius:10px;
  padding:8px;
  font-family:var(--font-m);
  font-size:.7rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  cursor:pointer;
  transition:all .2s;
}
#nota-composer button:hover{
  background:#c4952a;
  transform:translateY(-1px);
}
.nota-item button{
  background:transparent;
  border:1px solid var(--border-light);
  border-radius:6px;
  padding:4px 10px;
  font-family:var(--font-m);
  font-size:.6rem;
  color:var(--ghost);
  cursor:pointer;
  transition:all .15s;
}
.nota-item button:hover{
  border-color:var(--gold);
  color:var(--gold);
}
</style>



</head>
<body>
<div id="layout">

  <header id="topbar">
    <button class="topbar-back" onclick="window.close()">← Voltar</button>
    <div class="topbar-title">Study<span>Thread</span> · Aprofundamento</div>
    <span class="topbar-badge" id="topbar-tipo">—</span>
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="exportarMarkdown()">⬇ Exportar MD</button>
      <button class="btn btn-gold" onclick="salvarManual()">💾 Salvar</button>
    </div>
  </header>

  <div id="editor-col">
    <div id="post-origem">
      <div class="origem-label">✦ Post de origem</div>
      <div class="origem-conteudo" id="origem-conteudo">Carregando…</div>
      <div class="origem-meta">
        <div class="origem-autor" id="origem-autor"></div>
        <div class="origem-tags" id="origem-tags"></div>
      </div>
    </div>

    <div id="notion-editor"></div>
  </div>

  <div id="sidebar-col">
    <div class="sidebar-head">
      <div style="font-family:var(--font-d);font-size:.9rem;color:var(--sepia);font-style:italic;margin-bottom:8px;">Thread do post</div>
    </div>
    <div class="sidebar-tabs">
      <button class="stab active" id="stab-comentarios" onclick="mudarStab('comentarios')">Comentários</button>
      <button class="stab" id="stab-anotacoes"  onclick="mudarStab('anotacoes')">Minhas Notas</button>
    </div>
    <div class="sidebar-body" id="sidebar-body">
      <div class="sc-empty">Carregando…</div>
    </div>
  </div>
</div>

<div id="slash-menu">
  <div class="slash-item" onclick="inserirBloco('h1')"><span class="slash-icon">H1</span><span class="slash-label">Título grande</span><span class="slash-hint">Título</span></div>
  <div class="slash-item" onclick="inserirBloco('h2')"><span class="slash-icon">H2</span><span class="slash-label">Título médio</span><span class="slash-hint">Subtítulo</span></div>
  <div class="slash-item" onclick="inserirBloco('h3')"><span class="slash-icon">H3</span><span class="slash-label">Título pequeno</span><span class="slash-hint">Seção</span></div>
  <div class="slash-item" onclick="inserirBloco('bullet')"><span class="slash-icon">•</span><span class="slash-label">Lista com marcadores</span></div>
  <div class="slash-item" onclick="inserirBloco('num')"><span class="slash-icon">1.</span><span class="slash-label">Lista numerada</span></div>

function toast(msg, tipo = 'info') {

  let container = document.getElementById('toast-container');

  if (!container) {

    container = document.createElement('div');
    container.id = 'toast-container';

    container.style.cssText = `
      position:fixed;
      bottom:20px;
      right:20px;
      z-index:9999;
      display:flex;
      flex-direction:column;
      gap:8px;
    `;

    document.body.appendChild(container);
  }

  const el = document.createElement('div');

  const bg =
    tipo === 'success'
      ? 'var(--sage)'
      : tipo === 'error'
      ? 'var(--rust)'
      : 'var(--gold)';

  el.style.cssText = `
    background:${bg};
    color:var(--ink);
    padding:8px 16px;
    border-radius:4px;
    font-family:var(--font-m);
    font-size:0.75rem;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    transform:translateX(120%);

  `;

  el.textContent = msg;

  container.appendChild(el);

  setTimeout(() => {
    el.style.transform = 'translateX(0)';
  }, 10);

  setTimeout(() => {

    el.style.transform = 'translateX(120%)';

    setTimeout(() => {
      el.remove();
    }, 300);

  }, 3000);
}

async function carregarPost() {

  try {

    const snap =
      await db.collection('posts')
      .doc(postId)
      .get();

    if (!snap.exists) return;

    postData = snap.data();

    document.getElementById('origem-conteudo').textContent =
      postData.conteudo || '';

    document.getElementById('topbar-tipo').textContent =
      postData.tipo || 'post';

    const autorEl = document.getElementById('origem-autor');

    if (postData.autorEmoji || postData.autorNome) {

      autorEl.innerHTML = `
        <span class="origem-dot">
          ${postData.autorEmoji || '🧑'}
        </span>

        <span>
          ${postData.autorNome || 'Usuário'}
        </span>

        <span>
          · ${tsF(postData.timestamp)}
        </span>
      `;
    }

    const tagsEl = document.getElementById('origem-tags');

    tagsEl.innerHTML = '';

    (postData.tags || []).forEach(t => {

      const s = document.createElement('span');

      s.className = 'origem-tag';
      s.textContent = '#' + t;

      tagsEl.appendChild(s);
    });

  } catch (e) {
    console.error(e);
  }
}

async function carregarComentarios() {

      .get();

async function carregarNotas() {
  try {

    const snap = await db.collection('anotacoes')
      .where('postId', '==', postId)
      .orderBy('criadoEm', 'desc')
      .get();

    return snap.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

  } catch (e) {
    console.error('Erro ao carregar notas:', e);
    return [];
  }
}



async function salvarNotaFirestore(nota) {

  try {

    if (nota.id) {

      await db.collection('anotacoes')
      .doc(nota.id)
      .update({
        texto: nota.texto,
        tipo: nota.tipo,
        embedUrl: nota.embedUrl || null,
        editadoEm: new Date().toISOString()
      });

    } else {

      await db.collection('anotacoes')
      .add({
        postId: postId,
        texto: nota.texto,
        tipo: nota.tipo,
        embedUrl: nota.embedUrl || null,
        criadoEm: new Date().toISOString(),
        editadoEm: null
      });
    }

    return true;

  } catch (e) {

    console.error(e);

    toast('Erro ao salvar', 'error');

    return false;
  }
}

// ============================================================

function coletarBlocos() {

  const editor =
    document.getElementById('notion-editor');

  const resultado = [];

  editor.querySelectorAll('.notion-block')
    .forEach(blockEl => {

      const id = blockEl.dataset.id;
      const tipo = blockEl.dataset.tipo;

      if (tipo === 'divider') {

        resultado.push({
          id,
          tipo,
          conteudo: ''
        });

      } else if (
        tipo === 'youtube' ||
        tipo === 'link'
      ) {

        const bloco =
          blocos.find(b => b.id === id) || {};

        resultado.push({
          id,
          tipo,
          conteudo: bloco.conteudo || ''
        });

      } else {

        const contentEl =
          blockEl.querySelector('.block-content');

        resultado.push({
          id,
          tipo,
          conteudo:
            contentEl
              ? contentEl.innerHTML
              : ''
        });
      }
    });

  return resultado;
}

function extrairYoutubeId(url) {

  if (!url) return null;

  const patterns = [

    /(?:youtube\.com\/watch\?v=)([\w-]+)/,

    /(?:youtu\.be\/)([\w-]+)/,

    /(?:youtube\.com\/embed\/)([\w-]+)/
  ];

  for (const p of patterns) {

    const m = url.match(p);

    if (m) return m[1];
  }

  return null;
}

function youtubeEmbedUrl(url) {

  const id = extrairYoutubeId(url);

  return id
    ? `https://www.youtube.com/embed/${id}`
    : null;
}

function criarBlocoEl(bloco) {

  const wrapper =

  wrapper.className = 'notion-block';

  wrapper.dataset.id = bloco.id;
  wrapper.dataset.tipo = bloco.tipo;

  const handle =
    document.createElement('div');

  handle.className = 'block-handle';
  handle.textContent = '⠿';

  wrapper.appendChild(handle);

  const inner =
    document.createElement('div');

  inner.style.flex = '1';

  if (bloco.tipo === 'divider') {

    inner.innerHTML =
      `<hr class="block-divider">`;

  } else {

        class="block-content block-${bloco.tipo}"
        contenteditable="true"
      >
        ${bloco.conteudo || ''}
      </div>
    `;
  }

  wrapper.appendChild(inner);

  return wrapper;
}

function renderComentariosSidebar(container) {

  const raiz =
    comentarios.filter(c => !c.parentId);

  if (!raiz.length) {

    container.innerHTML =
      '<div class="sc-empty">Nenhum comentário ainda.</div>';

    return;
  }

  container.innerHTML =
    raiz.map(c =>
      renderScNode(c, comentarios)
    ).join('');
}

function renderScNode(c, all, depth = 0) {

  const replies =
    all.filter(x => x.parentId === c.id);

  const nc =
    depth > 0 ? 'nested' : '';

  return `
    <div class="sc-node ${nc}">

      <div class="sc-bubble">

        <div class="sc-head">

          <span>
            ${c.autorEmoji || '👤'}
          </span>

          <span class="sc-autor">
            ${c.autor || 'Usuário'}
          </span>

          <span class="sc-tipo">
            ${c.tipo || 'resposta'}
          </span>

        </div>

        <div class="sc-body">
          ${esc(c.conteudo || '')}
        </div>

        <div class="sc-ts">
          ${tsF(c.timestamp)}
        </div>

      </div>

      ${replies.map(r =>
        renderScNode(r, all, depth + 1)
      ).join('')}

    </div>
  `;
}

async function adicionarNota() {

  const ta =
    document.getElementById('nota-nova-txt');

  if (!ta) return;

  const txt = ta.value.trim();

  if (!txt) {

    toast('Digite algo', 'warning');

    return;
  }

  const nota = {
    texto: txt,
    tipo: 'texto'
  };

  const ytEmbed =
    youtubeEmbedUrl(txt);

  if (ytEmbed) {

    nota.tipo = 'youtube';
    nota.embedUrl = ytEmbed;

  } else if (/^https?:\/\//.test(txt)) {

    nota.tipo = 'link';
  }

  const ok =
    await salvarNotaFirestore(nota);

  if (ok) {

    ta.value = '';

    await renderSidebar();

    toast(
      'Anotação salva!',
      'success'
    );
  }
}

function exportarMarkdown() {

  blocos = coletarBlocos();

  const lines = [];

  if (postData) {

    lines.push(
      `> **Post original:** ${postData.conteudo}\n`
    );
  }

  lines.push('---\n');

  blocos.forEach(b => {

    const txt =
      (b.conteudo || '')
      .replace(/<[^>]+>/g, '')
      .trim();

    switch (b.tipo) {

      case 'h1':
        lines.push(`# ${txt}`);
        break;

      case 'h2':
        lines.push(`## ${txt}`);
        break;

      case 'h3':
        lines.push(`### ${txt}`);
        break;

      case 'bullet':
        lines.push(`- ${txt}`);
        break;

      case 'num':
        lines.push(`1. ${txt}`);
        break;

      case 'quote':
        lines.push(`> ${txt}`);
        break;

      case 'callout':
        lines.push(`> 💡 ${txt}`);
        break;

      case 'code':
        lines.push(
          '```\n' + txt + '\n```'
        );
        break;

      case 'divider':
        lines.push('---');
        break;

      case 'youtube':
        lines.push(
          `[▶ Vídeo](${b.conteudo})`
        );
        break;

      case 'link':
        lines.push(
          `[🔗 Link](${b.conteudo})`
        );
        break;

      default:

        if (txt) {
          lines.push(txt);
        }
    }

    lines.push('');
  });

  const blob =
    new Blob(
      [lines.join('\n')],
      { type: 'text/markdown' }
    );

  const a =
    document.createElement('a');

  a.href =
    URL.createObjectURL(blob);

  a.download =
    `aprofundamento-${postId}.md`;

  a.click();
}

// ============================================================
// CTRL + ENTER NAS NOTAS
// ============================================================
document.addEventListener(
  'keydown',
  e => {

    if (
      (e.ctrlKey || e.metaKey) &&
      e.key === 'Enter'
    ) {

      const el =
        document.activeElement;

      if (
        el &&
        el.id === 'nota-nova-txt'
      ) {

        e.preventDefault();

        adicionarNota();
      }
    }
  }
);
</script>
