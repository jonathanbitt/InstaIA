<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StudyThread — Aprofundamento</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
:root {
  --ink:#1a1410;--paper:#f9f6f0;--aged:#f0ebe0;--sepia:#c8b89a;--rust:#8b3a2a;--gold:#c4952a;--sage:#4a6741;--slate:#3d4f5c;--ghost:#7a7060;--margin:#d4c9b0;
  --font-d:'Playfair Display',Georgia,serif;
  --font-b:'Crimson Pro','Times New Roman',serif;
  --font-m:'DM Mono','Courier New',monospace;
  --r:4px; --sidebar:320px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-b);font-size:17px;line-height:1.7;color:var(--ink);background:var(--paper);}

/* ── LAYOUT ── */
#layout{display:grid;grid-template-columns:1fr var(--sidebar);grid-template-rows:56px 1fr;height:100vh;}

/* ── TOPBAR ── */
#topbar{
  grid-column:1/-1;
  background:var(--ink);border-bottom:2px solid var(--gold);
  display:flex;align-items:center;gap:16px;padding:0 24px;
  position:sticky;top:0;z-index:30;
}
.topbar-back{
  background:transparent;border:1px solid rgba(255,255,255,.15);
  color:var(--sepia);font-family:var(--font-m);font-size:.7rem;
  padding:5px 12px;border-radius:var(--r);cursor:pointer;
  transition:all .15s;text-transform:uppercase;letter-spacing:.08em;
}
.topbar-back:hover{background:rgba(196,149,42,.2);color:var(--gold);}
.topbar-title{font-family:var(--font-d);font-size:1.1rem;color:var(--paper);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-title span{color:var(--gold);font-style:italic;}
.topbar-badge{font-family:var(--font-m);font-size:.6rem;padding:2px 8px;border-radius:10px;background:rgba(196,149,42,.15);color:var(--gold);border:1px solid rgba(196,149,42,.25);white-space:nowrap;}
.topbar-actions{display:flex;gap:8px;}
.btn{font-family:var(--font-m);font-size:.68rem;letter-spacing:.07em;padding:6px 13px;border-radius:var(--r);border:none;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.btn-gold{background:var(--gold);color:var(--ink);}.btn-gold:hover{background:#b5882a;}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--sepia);}.btn-ghost:hover{background:rgba(255,255,255,.08);color:var(--paper);}
.btn-sage{background:var(--sage);color:var(--paper);}.btn-sage:hover{background:#3d5835;}

/* ── MAIN EDITOR ── */
#editor-col{
  overflow-y:auto;
  background:var(--paper);
  background-image:repeating-linear-gradient(transparent,transparent 31px,rgba(196,149,42,.05) 31px,rgba(196,149,42,.05) 32px);
}

/* Post origin card */
#post-origem{
  background:var(--aged);
  border-bottom:2px solid var(--margin);
  padding:28px 48px;
  position:relative;
}
.origem-label{font-family:var(--font-m);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ghost);margin-bottom:10px;}
.origem-tipo{font-family:var(--font-m);font-size:.6rem;padding:2px 8px;border-radius:2px;margin-right:8px;}
.origem-conteudo{font-family:var(--font-d);font-size:1.35rem;line-height:1.6;color:var(--ink);font-style:italic;margin-bottom:12px;}
.origem-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.origem-autor{display:flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:.7rem;color:var(--ghost);}
.origem-dot{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;}
.origem-tags{display:flex;gap:6px;flex-wrap:wrap;}
.origem-tag{font-family:var(--font-m);font-size:.58rem;padding:1px 7px;border-radius:10px;background:rgba(196,149,42,.1);color:var(--gold);border:1px solid rgba(196,149,42,.2);}

/* Notion-like editor area */
#notion-editor{
  max-width:740px;
  margin:0 auto;
  padding:40px 48px 120px;
  min-height:calc(100vh - 280px);
}

/* Toolbar flutuante */
#toolbar{
  display:flex;gap:4px;align-items:center;
  background:var(--ink);
  border-radius:8px;
  padding:6px 8px;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  position:fixed;
  z-index:100;
  opacity:0;pointer-events:none;
  transition:opacity .15s;
  flex-wrap:wrap;
  max-width:520px;
}
#toolbar.visible{opacity:1;pointer-events:all;}
.tb-btn{
  background:transparent;border:none;color:var(--sepia);
  font-size:.8rem;padding:4px 8px;border-radius:3px;
  cursor:pointer;font-family:var(--font-m);transition:all .12s;
  white-space:nowrap;
}
.tb-btn:hover{background:rgba(255,255,255,.1);color:var(--gold);}
.tb-sep{width:1px;height:16px;background:rgba(255,255,255,.15);margin:0 2px;}

/* Blocos */
.notion-block{
  position:relative;
  margin:2px 0;
  border-radius:4px;
  transition:background .1s;
  display:flex;
  align-items:flex-start;
  gap:8px;
}
.notion-block:hover{background:rgba(196,149,42,.04);}
.notion-block:hover .block-handle{opacity:1;}

.block-handle{
  opacity:0;
  cursor:grab;
  color:var(--margin);
  font-size:.85rem;
  padding:4px 2px;
  margin-top:2px;
  flex-shrink:0;
  transition:opacity .15s;
  width:20px;
  text-align:center;
  user-select:none;
}
.block-handle:active{cursor:grabbing;}

.block-content{flex:1;min-width:0;outline:none;}

/* Tipos de bloco */
.block-p{font-family:var(--font-b);font-size:1rem;line-height:1.75;color:var(--ink);padding:2px 0;}
.block-p:empty::before{content:attr(data-ph);color:var(--margin);pointer-events:none;}

.block-h1{font-family:var(--font-d);font-size:1.8rem;font-weight:700;line-height:1.3;color:var(--ink);padding:12px 0 4px;border-bottom:2px solid var(--margin);margin-bottom:4px;}
.block-h1:empty::before{content:'Título'; color:var(--margin);pointer-events:none;}

.block-h2{font-family:var(--font-d);font-size:1.3rem;font-weight:700;line-height:1.4;color:var(--ink);padding:8px 0 2px;}
.block-h2:empty::before{content:'Subtítulo';color:var(--margin);pointer-events:none;}

.block-h3{font-family:var(--font-d);font-size:1.05rem;font-weight:700;line-height:1.4;color:var(--ghost);padding:6px 0 2px;}
.block-h3:empty::before{content:'Seção';color:var(--margin);pointer-events:none;}

.block-bullet{font-family:var(--font-b);font-size:1rem;line-height:1.65;color:var(--ink);padding:2px 0 2px 20px;position:relative;}
.block-bullet::before{content:'•';position:absolute;left:4px;color:var(--gold);}
.block-bullet:empty::before{content:'• Item da lista';left:4px;color:var(--margin);}

.block-num{font-family:var(--font-b);font-size:1rem;line-height:1.65;color:var(--ink);padding:2px 0 2px 28px;position:relative;}
.block-num:empty::before{content:'Item numerado';color:var(--margin);}

.block-quote{
  font-family:var(--font-d);font-size:1.1rem;font-style:italic;
  line-height:1.7;color:var(--slate);
  border-left:4px solid var(--gold);
  padding:8px 16px;margin:8px 0;
  background:rgba(196,149,42,.05);border-radius:0 4px 4px 0;
}
.block-quote:empty::before{content:'"Citação ou destaque…"';color:var(--margin);}

.block-callout{
  background:rgba(196,149,42,.08);border:1px solid rgba(196,149,42,.2);
  border-radius:6px;padding:12px 16px;margin:8px 0;
  font-family:var(--font-b);font-size:.95rem;line-height:1.65;
}
.block-callout:empty::before{content:'💡 Nota importante…';color:var(--margin);}

.block-divider{border:none;border-top:2px dashed var(--margin);margin:16px 0;pointer-events:none;}

.block-code{
  font-family:var(--font-m);font-size:.85rem;
  background:#1a1410;color:#c0b080;
  padding:14px 16px;border-radius:6px;margin:8px 0;
  line-height:1.6;white-space:pre-wrap;word-break:break-all;
}
.block-code:empty::before{content:'// Código…';color:#5a4a30;}

/* Embed YouTube */
.block-youtube{margin:12px 0;}
.youtube-input-wrap{display:flex;gap:8px;align-items:center;}
.youtube-input-wrap input{
  flex:1;background:var(--aged);border:1px solid var(--margin);
  border-radius:var(--r);padding:8px 12px;
  font-family:var(--font-m);font-size:.78rem;color:var(--ink);outline:none;
  transition:border-color .2s;
}
.youtube-input-wrap input:focus{border-color:var(--gold);}
.youtube-embed{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:6px;background:#1a1410;margin-top:8px;}
.youtube-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;border-radius:6px;}
.youtube-label{font-family:var(--font-m);font-size:.62rem;color:var(--ghost);margin-bottom:6px;letter-spacing:.1em;text-transform:uppercase;}

/* Embed link */
.block-link{
  border:1px solid var(--margin);border-radius:6px;
  padding:12px 16px;margin:8px 0;
  display:flex;align-items:center;gap:10px;
  background:var(--aged);text-decoration:none;
  transition:border-color .2s;
}
.block-link:hover{border-color:var(--gold);}
.link-icon{font-size:1.2rem;flex-shrink:0;}
.link-info{flex:1;min-width:0;}
.link-url{font-family:var(--font-m);font-size:.7rem;color:var(--ghost);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.link-title{font-family:var(--font-b);font-size:.95rem;color:var(--ink);margin-bottom:2px;}

/* Bloco imagem */
.block-image{margin:12px 0;text-align:center;}
.block-image img{max-width:100%;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.1);}
.image-caption{font-family:var(--font-m);font-size:.65rem;color:var(--ghost);margin-top:6px;font-style:italic;}

/* Menu de inserção "/" */
#slash-menu{
  position:fixed;z-index:200;
  background:var(--paper);
  border:1px solid var(--margin);
  border-radius:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
  min-width:240px;
  max-height:320px;
  overflow-y:auto;
  display:none;
}
#slash-menu.open{display:block;}
.slash-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;cursor:pointer;
  font-family:var(--font-b);font-size:.9rem;color:var(--ink);
  transition:background .1s;
}
.slash-item:hover,.slash-item.active{background:rgba(196,149,42,.08);}
.slash-icon{font-size:1rem;width:24px;text-align:center;flex-shrink:0;}
.slash-label{flex:1;}
.slash-hint{font-family:var(--font-m);font-size:.62rem;color:var(--ghost);}

/* Bloco selecionado */
.notion-block.selected{background:rgba(196,149,42,.1);}

/* ── SIDEBAR ── */
#sidebar-col{
  background:#1c1610;
  border-left:1px solid #3d3020;
  overflow-y:auto;
  display:flex;flex-direction:column;
}
.sidebar-head{
  padding:16px 18px;
  background:#221b13;
  border-bottom:1px solid #3d3020;
  position:sticky;top:0;z-index:2;
  flex-shrink:0;
}
.sidebar-tabs{display:flex;gap:0;border-bottom:1px solid #3d3020;flex-shrink:0;}
.stab{
  flex:1;background:transparent;border:none;border-bottom:2px solid transparent;
  margin-bottom:-1px;padding:10px 8px;
  font-family:var(--font-m);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
  color:#5a4d3a;cursor:pointer;transition:all .15s;
}
.stab:hover{color:var(--sepia);}
.stab.active{color:var(--gold);border-bottom-color:var(--gold);}

.sidebar-body{flex:1;overflow-y:auto;padding:14px;}

/* Comentários na sidebar */
.sc-node{margin-bottom:10px;}
.sc-node.nested{margin-left:14px;border-left:2px solid #3d3020;padding-left:10px;}
.sc-bubble{background:#252018;border:1px solid #3d3020;border-radius:5px;overflow:hidden;}
.sc-head{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#1e1810;border-bottom:1px solid #3d3020;flex-wrap:wrap;}
.sc-autor{font-family:var(--font-m);font-size:.65rem;flex:1;}
.sc-tipo{font-family:var(--font-m);font-size:.55rem;padding:1px 5px;border-radius:2px;text-transform:uppercase;}
.ct-resposta{background:#1e2d3d;color:#6a9abf;}
.ct-aula{background:#2d1e3d;color:#9a6abf;}
.ct-explicacao{background:#1e3d2d;color:#6abf9a;}
.ct-exercicio{background:#3d2d1e;color:#bf9a6a;}
.ct-correcao{background:#3d1e1e;color:#bf6a6a;}
.ct-sintese{background:#2d3d1e;color:#9abf6a;}
.sc-body{padding:8px 10px;font-size:.84rem;color:#bfb090;line-height:1.6;font-family:var(--font-b);}
.sc-body a{color:#9a8060;text-decoration:underline;}
.sc-ts{font-family:var(--font-m);font-size:.55rem;color:#4a4030;padding:4px 10px;border-top:1px solid #3d3020;}
.sc-empty{color:#4a4030;font-family:var(--font-d);font-style:italic;font-size:.82rem;padding:20px 0;text-align:center;}

/* Status bar */
#status-bar{
  position:fixed;bottom:0;left:0;right:var(--sidebar);
  background:var(--aged);border-top:1px solid var(--margin);
  padding:6px 48px;
  display:flex;align-items:center;gap:16px;
  font-family:var(--font-m);font-size:.62rem;color:var(--ghost);
  z-index:20;
}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--sage);}
.status-dot.saving{background:var(--gold);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* Scrollbars */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#4a3d2a;border-radius:3px;}

/* Tipo badges */
.tipo-filosofia{background:#ede8f5;color:#4a2d7a;}
.tipo-fisica{background:#e8f4ff;color:#1a3a6a;}
.tipo-matematica{background:#e8f0f5;color:#1a4a7a;}
.tipo-idioma{background:#f5ede8;color:#7a3a1a;}
.tipo-logica{background:#e8f5ed;color:#1a7a4a;}
.tipo-ciencia{background:#f5f0e8;color:#7a5a1a;}
.tipo-historia{background:#ede8e8;color:#7a1a1a;}
.tipo-literatura{background:#f0ede8;color:#5a3a1a;}
.tipo-outro{background:#e8e8e8;color:#4a4a4a;}

/* Link block em modo input */
.link-block-input{display:flex;gap:8px;align-items:center;}
.link-block-input input{flex:1;background:var(--aged);border:1px solid var(--margin);border-radius:var(--r);padding:8px 12px;font-family:var(--font-m);font-size:.78rem;color:var(--ink);outline:none;}
.link-block-input input:focus{border-color:var(--gold);}

/* Drag */
.notion-block.dragging{opacity:.4;}
.notion-block.drag-over{border-top:2px solid var(--gold);}
</style>
</head>
<body>
<div id="layout">

  <!-- TOPBAR -->
  <header id="topbar">
    <button class="topbar-back" onclick="window.close()">← Voltar</button>
    <div class="topbar-title">Study<span>Thread</span> · Aprofundamento</div>
    <span class="topbar-badge" id="topbar-tipo">—</span>
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="exportarMarkdown()">⬇ Exportar MD</button>
      <button class="btn btn-gold" onclick="salvarManual()">💾 Salvar</button>
    </div>
  </header>

  <!-- EDITOR PRINCIPAL -->
  <div id="editor-col">
    <!-- Post de origem -->
    <div id="post-origem">
      <div class="origem-label">✦ Post de origem</div>
      <div class="origem-conteudo" id="origem-conteudo">Carregando…</div>
      <div class="origem-meta">
        <div class="origem-autor" id="origem-autor"></div>
        <div class="origem-tags" id="origem-tags"></div>
      </div>
    </div>

    <!-- Editor Notion -->
    <div id="notion-editor" id="notion-editor">
      <!-- blocos renderizados aqui -->
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar-col">
    <div class="sidebar-head">
      <div style="font-family:var(--font-d);font-size:.9rem;color:var(--sepia);font-style:italic;margin-bottom:8px;">Thread do post</div>
    </div>
    <div class="sidebar-tabs">
      <button class="stab active" id="stab-comentarios" onclick="mudarStab('comentarios')">Comentários</button>
      <button class="stab" id="stab-anotacoes"  onclick="mudarStab('anotacoes')">Minhas Notas</button>
    </div>
    <div class="sidebar-body" id="sidebar-body">
      <div class="sc-empty">Carregando…</div>
    </div>
  </div>
</div>

<!-- Menu "/" -->
<div id="slash-menu">
  <div class="slash-item" onclick="inserirBloco('h1')"><span class="slash-icon">H1</span><span class="slash-label">Título grande</span><span class="slash-hint">Título</span></div>
  <div class="slash-item" onclick="inserirBloco('h2')"><span class="slash-icon">H2</span><span class="slash-label">Título médio</span><span class="slash-hint">Subtítulo</span></div>
  <div class="slash-item" onclick="inserirBloco('h3')"><span class="slash-icon">H3</span><span class="slash-label">Título pequeno</span><span class="slash-hint">Seção</span></div>
  <div class="slash-item" onclick="inserirBloco('bullet')"><span class="slash-icon">•</span><span class="slash-label">Lista com marcadores</span></div>
  <div class="slash-item" onclick="inserirBloco('num')"><span class="slash-icon">1.</span><span class="slash-label">Lista numerada</span></div>
  <div class="slash-item" onclick="inserirBloco('quote')"><span class="slash-icon">❝</span><span class="slash-label">Citação / destaque</span></div>
  <div class="slash-item" onclick="inserirBloco('callout')"><span class="slash-icon">💡</span><span class="slash-label">Nota / callout</span></div>
  <div class="slash-item" onclick="inserirBloco('code')"><span class="slash-icon">{}</span><span class="slash-label">Código</span></div>
  <div class="slash-item" onclick="inserirBloco('divider')"><span class="slash-icon">—</span><span class="slash-label">Divisor</span></div>
  <div class="slash-item" onclick="inserirBloco('youtube')"><span class="slash-icon">▶</span><span class="slash-label">Vídeo YouTube</span></div>
  <div class="slash-item" onclick="inserirBloco('link')"><span class="slash-icon">🔗</span><span class="slash-label">Link externo</span></div>
</div>

<!-- Toolbar de formatação -->
<div id="toolbar">
  <button class="tb-btn" onclick="fmt('bold')"><b>B</b></button>
  <button class="tb-btn" onclick="fmt('italic')"><i>I</i></button>
  <button class="tb-btn" onclick="fmt('underline')"><u>U</u></button>
  <button class="tb-btn" onclick="fmt('strikeThrough')"><s>S</s></button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="converterBloco('h1')">H1</button>
  <button class="tb-btn" onclick="converterBloco('h2')">H2</button>
  <button class="tb-btn" onclick="converterBloco('h3')">H3</button>
  <button class="tb-btn" onclick="converterBloco('quote')">❝</button>
  <button class="tb-btn" onclick="converterBloco('bullet')">•</button>
  <button class="tb-btn" onclick="converterBloco('callout')">💡</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="excluirBlocoSelecionado()">🗑</button>
</div>

<!-- Status bar -->
<div id="status-bar">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-txt">Pronto</span>
  <span style="margin-left:auto;" id="status-blocos">0 blocos</span>
</div>

window.addEventListener('DOMContentLoaded', async () => {
  postId = localStorage.getItem('st-aprofundamento-postId');
  if (!postId) { document.getElementById('origem-conteudo').textContent = 'Post não encontrado.'; return; }

  await carregarPost();
  await carregarBlocos();
  await carregarComentarios();
  renderEditor();
  renderSidebar();
});

async function carregarPost() {
  try {
    const snap = await db.collection('posts').doc(postId).get();
    if (!snap.exists) return;
    postData = snap.data();

    document.getElementById('origem-conteudo').textContent = postData.conteudo;
    document.getElementById('topbar-tipo').textContent = postData.tipo || 'post';
    document.getElementById('topbar-tipo').className = `topbar-badge tipo-${postData.tipo}`;

    const autorEl = document.getElementById('origem-autor');
    if (postData.autorEmoji || postData.autorNome) {
      autorEl.innerHTML = `
        <span class="origem-dot" style="background:${postData.autorCor||'#c4952a'}22;border:1px solid ${postData.autorCor||'#c4952a'}44;">${postData.autorEmoji||'🧑'}</span>
        <span style="color:${postData.autorCor||'#c4952a'}">${postData.autorNome||'Usuário'}</span>
        <span>· ${tsF(postData.timestamp)}</span>`;
    }

    const tagsEl = document.getElementById('origem-tags');
    (postData.tags||[]).forEach(t => {
      const s = document.createElement('span');
      s.className = 'origem-tag';
      s.textContent = '#'+t;
      tagsEl.appendChild(s);
    });
  } catch(e) { console.error(e); }
}

async function carregarBlocos() {
  try {
    const snap = await db.collection('aprofundamentos').doc(postId).get();
    if (snap.exists && snap.data().blocos) {
      blocos = snap.data().blocos;
    } else {
      // Blocos iniciais padrão
      blocos = [
        { id: uid(), tipo:'h1', conteudo:'Meu Aprofundamento' },
        { id: uid(), tipo:'p',  conteudo:'' },
      ];
    }
  } catch(e) { blocos = [{ id:uid(), tipo:'h1', conteudo:'Meu Aprofundamento' },{ id:uid(), tipo:'p', conteudo:'' }]; }
}

async function carregarComentarios() {
  try {
    const snap = await db.collection('comments').where('postId','==',postId).orderBy('timestamp','asc').get();
    comentarios = snap.docs.map(d => d.data());
  } catch(e) { comentarios = []; }
}

/* ════════════════════════════════════════
   SALVAR
════════════════════════════════════════ */
function coletarBlocos() {
  const editor = document.getElementById('notion-editor');
  const resultado = [];
  editor.querySelectorAll('.notion-block').forEach(blockEl => {
    const id   = blockEl.dataset.id;
    const tipo = blockEl.dataset.tipo;
    const bloco = blocos.find(b => b.id === id) || {};

    if (tipo === 'divider') {
      resultado.push({ id, tipo, conteudo:'' });
    } else if (tipo === 'youtube') {
      resultado.push({ id, tipo, conteudo: bloco.conteudo||'' });
    } else if (tipo === 'link') {
      resultado.push({ id, tipo, conteudo: bloco.conteudo||'' });
    } else {
      const contentEl = blockEl.querySelector('.block-content');
      resultado.push({ id, tipo, conteudo: contentEl ? contentEl.innerHTML : '' });
    }
  });
  return resultado;
}

async function salvar(silencioso=false) {
  setStatus('saving','Salvando…');
  blocos = coletarBlocos();
  try {
    await db.collection('aprofundamentos').doc(postId).set({ blocos, atualizadoEm: new Date().toISOString() }, { merge:true });
    setStatus('ok', silencioso ? 'Salvo automaticamente' : 'Salvo!');
    atualizarStatusBlocos();
  } catch(e) {
    setStatus('ok','Erro ao salvar'); console.error(e);
  }
}

function salvarManual() { salvar(false); }

function agendarAutoSave() {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => salvar(true), 2500);
}

function setStatus(tipo, msg) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-txt');
  dot.className = 'status-dot' + (tipo==='saving'?' saving':'');
  txt.textContent = msg;
}

function atualizarStatusBlocos() {
  document.getElementById('status-blocos').textContent = `${blocos.length} bloco${blocos.length!==1?'s':''}`;
}

/* ════════════════════════════════════════
   RENDER EDITOR
════════════════════════════════════════ */
function renderEditor() {
  const editor = document.getElementById('notion-editor');
  editor.innerHTML = '';
  blocos.forEach(b => editor.appendChild(criarBlocoEl(b)));
  atualizarStatusBlocos();
}

function criarBlocoEl(bloco) {
  const wrapper = document.createElement('div');
  wrapper.className = 'notion-block';
  wrapper.dataset.id   = bloco.id;
  wrapper.dataset.tipo = bloco.tipo;
  wrapper.draggable = true;

  // Handle de drag
  const handle = document.createElement('div');
  handle.className = 'block-handle';
  handle.textContent = '⠿';
  handle.title = 'Arrastar';

  let inner = '';

  if (bloco.tipo === 'divider') {
    wrapper.innerHTML = `<hr class="block-divider" style="flex:1;"/>`;
    return wrapper;
  }

  if (bloco.tipo === 'youtube') {
    inner = renderBlocoYoutube(bloco);
  } else if (bloco.tipo === 'link') {
    inner = renderBlocoLink(bloco);
  } else {
    const tag = tipoToTag(bloco.tipo);
    const ph  = tipoPlaceholder(bloco.tipo);
    inner = `<div class="block-content ${tipoToClass(bloco.tipo)}"
              contenteditable="true"
              data-ph="${ph}"
              >${bloco.conteudo||''}</div>`;
  }

  wrapper.innerHTML = '';
  wrapper.appendChild(handle);
  const innerDiv = document.createElement('div');
  innerDiv.style.flex = '1';
  innerDiv.style.minWidth = '0';
  innerDiv.innerHTML = inner;
  wrapper.appendChild(innerDiv);

  // Eventos no content-editable
  if (bloco.tipo !== 'youtube' && bloco.tipo !== 'link') {
    const ce = wrapper.querySelector('.block-content');
    if (ce) {
      ce.addEventListener('keydown', e => onKeyDown(e, wrapper));
      ce.addEventListener('input', () => { agendarAutoSave(); mostrarToolbarSeSelecionado(); });
      ce.addEventListener('mouseup', mostrarToolbarSeSelecionado);
      ce.addEventListener('keyup',   mostrarToolbarSeSelecionado);
      // Links clicáveis dentro de blocos editáveis
      ce.addEventListener('click', e => {
        const link = e.target.closest('a');
        if (link) { e.preventDefault(); window.open(link.href, '_blank', 'noopener'); }
      });
    }
  }

  // Drag events
  wrapper.addEventListener('dragstart', e => { draggingId = bloco.id; wrapper.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
  wrapper.addEventListener('dragend',   () => { wrapper.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over')); });
  wrapper.addEventListener('dragover',  e => { e.preventDefault(); wrapper.classList.add('drag-over'); });
  wrapper.addEventListener('dragleave', () => wrapper.classList.remove('drag-over'));
  wrapper.addEventListener('drop',      e => { e.preventDefault(); wrapper.classList.remove('drag-over'); moverBloco(draggingId, bloco.id); });

  return wrapper;
}

function moverBloco(fromId, toId) {
  if (fromId === toId) return;
  const fromIdx = blocos.findIndex(b=>b.id===fromId);
  const toIdx   = blocos.findIndex(b=>b.id===toId);
  if (fromIdx<0||toIdx<0) return;
  const [item] = blocos.splice(fromIdx,1);
  blocos.splice(toIdx,0,item);
  renderEditor();
  agendarAutoSave();
}

/* ── Render blocos especiais ── */
function renderBlocoYoutube(bloco) {
  if (bloco.conteudo) {
    const embedUrl = youtubeEmbedUrl(bloco.conteudo) || bloco.conteudo;
    return `<div class="block-youtube">
      <div class="youtube-label">▶ Vídeo YouTube <button onclick="removerYoutube('${bloco.id}')" style="background:transparent;border:none;color:var(--ghost);cursor:pointer;font-size:.7rem;margin-left:8px;">✕ Remover</button></div>
      <div class="youtube-embed"><iframe src="${embedUrl}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
    </div>`;
  }
  return `<div class="block-youtube">
    <div class="youtube-label">▶ Embed YouTube</div>
    <div class="youtube-input-wrap">
      <input type="text" placeholder="Cole o link do YouTube (youtu.be/… ou youtube.com/watch?v=…)" onkeydown="if(event.key==='Enter'){embedYoutube('${bloco.id}',this.value);}" />
      <button class="btn btn-gold" style="font-size:.65rem;padding:6px 10px;" onclick="embedYoutube('${bloco.id}',this.previousElementSibling.value)">Embed</button>
    </div>
  </div>`;
}

function renderBlocoLink(bloco) {
  if (bloco.conteudo) {
    const url = bloco.conteudo;
    const domain = (() => { try { return new URL(url).hostname; } catch { return url; } })();
    return `<a class="block-link" href="${url}" target="_blank" rel="noopener">
      <span class="link-icon">🔗</span>
      <div class="link-info">
        <div class="link-title">${domain}</div>
        <div class="link-url">${url}</div>
      </div>
      <button onclick="event.preventDefault();removerLink('${bloco.id}')" style="background:transparent;border:none;color:var(--ghost);cursor:pointer;font-size:.75rem;padding:4px;">✕</button>
    </a>`;
  }
  return `<div class="block-youtube">
    <div class="youtube-label">🔗 Link externo</div>
    <div class="link-block-input">
      <input type="text" placeholder="Cole a URL aqui…" onkeydown="if(event.key==='Enter'){embedLink('${bloco.id}',this.value);}" />
      <button class="btn btn-gold" style="font-size:.65rem;padding:6px 10px;" onclick="embedLink('${bloco.id}',this.previousElementSibling.value)">Adicionar</button>
    </div>
  </div>`;
}

/* ── Helpers ── */
function tipoToTag(tipo){const m={h1:'h1',h2:'h2',h3:'h3',bullet:'li',num:'li',quote:'blockquote',callout:'div',p:'p',code:'pre'};return m[tipo]||'p';}
function tipoToClass(tipo){return `block-${tipo}`;}
function tipoPlaceholder(tipo){const m={h1:'Título',h2:'Subtítulo',h3:'Seção',p:"Escreva algo, ou pressione '/' para inserir um bloco…",bullet:'Item da lista',num:'Item numerado',quote:'Citação ou destaque…',callout:'💡 Nota importante…',code:'// Código…'};return m[tipo]||'';}

function youtubeEmbed(url) {
  return youtubeEmbedUrl(url); // alias — youtubeEmbedUrl definido nas anotações
}

function embedYoutube(blocoId, url) {
  const trimmed = (url||'').trim();
  // youtubeEmbedUrl pode ainda não estar definida se chamada antes — tenta inline
  let id = null;
  if (trimmed.includes('youtube.com/watch?v=')) { try { id = new URLSearchParams(trimmed.split('?')[1]).get('v'); } catch {} }
  else if (trimmed.includes('youtu.be/'))         id = trimmed.split('youtu.be/')[1]?.split('?')[0];
  else if (trimmed.includes('youtube.com/embed/')) id = trimmed.split('/embed/')[1]?.split('?')[0];
  if (!id) { alert('Link do YouTube inválido. Use youtube.com/watch?v=... ou youtu.be/...'); return; }
  const b = blocos.find(x=>x.id===blocoId);
  if (b) { b.conteudo = trimmed; renderEditor(); agendarAutoSave(); }
}

function removerYoutube(blocoId) {
  const b = blocos.find(x=>x.id===blocoId);
  if (b) { b.conteudo = ''; renderEditor(); agendarAutoSave(); }
}

function embedLink(blocoId, url) {
  const b = blocos.find(x=>x.id===blocoId);
  if (b) { b.conteudo = (url||'').trim(); renderEditor(); agendarAutoSave(); }
}

function removerLink(blocoId) {
  const b = blocos.find(x=>x.id===blocoId);
  if (b) { b.conteudo = ''; renderEditor(); agendarAutoSave(); }
}

/* ════════════════════════════════════════
   TECLADO — Enter / Backspace / Slash
════════════════════════════════════════ */
let slashBlocoId = null;

function onKeyDown(e, blockEl) {
  const blocoId = blockEl.dataset.id;
  const ce      = blockEl.querySelector('.block-content');
  const tipo    = blockEl.dataset.tipo;

  // "/" abre menu de inserção
  if (e.key === '/' && ce.textContent.trim() === '') {
    e.preventDefault();
    abrirSlashMenu(blockEl, blocoId);
    return;
  }

  // Fecha slash menu em qualquer outra tecla
  fecharSlashMenu();

  // Enter = novo bloco parágrafo abaixo
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const novoBloco = { id:uid(), tipo:'p', conteudo:'' };
    const idx = blocos.findIndex(b=>b.id===blocoId);
    blocos = coletarBlocos(); // sincroniza antes de inserir
    blocos.splice(idx+1, 0, novoBloco);
    renderEditor();
    focarBloco(novoBloco.id);
    agendarAutoSave();
    return;
  }

  // Backspace em bloco vazio = remover bloco e focar anterior
  if (e.key === 'Backspace' && ce.textContent === '' && blocos.length > 1) {
    e.preventDefault();
    const idx = blocos.findIndex(b=>b.id===blocoId);
    blocos = coletarBlocos();
    blocos.splice(idx,1);
    renderEditor();
    focarBloco(blocos[Math.max(0,idx-1)]?.id);
    agendarAutoSave();
    return;
  }
}

function focarBloco(id) {
  if (!id) return;
  const el = document.querySelector(`[data-id="${id}"] .block-content`);
  if (el) { el.focus(); placeCaretAtEnd(el); }
}

function placeCaretAtEnd(el) {
  const range = document.createRange();
  const sel   = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

/* ════════════════════════════════════════
   SLASH MENU
════════════════════════════════════════ */
function abrirSlashMenu(blockEl, blocoId) {
  slashBlocoId = blocoId;
  const rect   = blockEl.getBoundingClientRect();
  const menu   = document.getElementById('slash-menu');
  menu.style.top  = (rect.bottom + 4) + 'px';
  menu.style.left = rect.left + 'px';
  menu.classList.add('open');
}

function fecharSlashMenu() {
  document.getElementById('slash-menu').classList.remove('open');
  slashBlocoId = null;
}

function inserirBloco(tipo) {
  fecharSlashMenu();
  const novoBloco = { id:uid(), tipo, conteudo:'' };

  if (slashBlocoId === null) {
    // Inserir ao final
    blocos = coletarBlocos();
    blocos.push(novoBloco);
  } else {
    const idx = blocos.findIndex(b=>b.id===slashBlocoId);
    blocos = coletarBlocos();
    // Remove o bloco "/" atual se estava vazio, insere novo
    if (idx>=0 && blocos[idx]?.conteudo?.replace(/<[^>]+>/g,'').trim()==='') {
      blocos.splice(idx,1,novoBloco);
    } else {
      blocos.splice(idx+1,0,novoBloco);
    }
  }

  renderEditor();
  if (tipo !== 'divider' && tipo !== 'youtube' && tipo !== 'link') {
    focarBloco(novoBloco.id);
  }
  agendarAutoSave();
}

// Fechar slash menu ao clicar fora
document.addEventListener('click', e => {
  if (!e.target.closest('#slash-menu') && !e.target.closest('.block-content')) fecharSlashMenu();
});

/* ════════════════════════════════════════
   TOOLBAR DE FORMATAÇÃO
════════════════════════════════════════ */
function mostrarToolbarSeSelecionado() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.toString().trim() === '') {
    document.getElementById('toolbar').classList.remove('visible');
    return;
  }
  const range = sel.getRangeAt(0);
  const rect  = range.getBoundingClientRect();
  const tb    = document.getElementById('toolbar');
  tb.style.top  = (rect.top - 48 + window.scrollY) + 'px';
  tb.style.left = (rect.left + rect.width/2 - 130) + 'px';
  tb.classList.add('visible');
}

document.addEventListener('mousedown', e => {
  if (!e.target.closest('#toolbar')) document.getElementById('toolbar').classList.remove('visible');
});

function fmt(cmd) { document.execCommand(cmd, false, null); }

function converterBloco(novoTipo) {
  const sel = window.getSelection();
  if (!sel) return;
  const anchorNode = sel.anchorNode;
  const blockEl = anchorNode?.closest?.('.notion-block') || anchorNode?.parentElement?.closest?.('.notion-block');
  if (!blockEl) return;
  const id = blockEl.dataset.id;
  blocos = coletarBlocos();
  const b = blocos.find(x=>x.id===id);
  if (b) { b.tipo = novoTipo; renderEditor(); focarBloco(id); agendarAutoSave(); }
  document.getElementById('toolbar').classList.remove('visible');
}

function excluirBlocoSelecionado() {
  const sel = window.getSelection();
  const anchorNode = sel?.anchorNode;
  const blockEl = anchorNode?.closest?.('.notion-block') || anchorNode?.parentElement?.closest?.('.notion-block');
  if (!blockEl || blocos.length <= 1) return;
  const id = blockEl.dataset.id;
  blocos = coletarBlocos();
  const idx = blocos.findIndex(b=>b.id===id);
  blocos.splice(idx,1);
  renderEditor();
  focarBloco(blocos[Math.max(0,idx-1)]?.id);
  agendarAutoSave();
  document.getElementById('toolbar').classList.remove('visible');
}

/* ════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════ */
function mudarStab(aba) {
  stab = aba;
  ['comentarios','anotacoes'].forEach(t => {
    document.getElementById(`stab-${t}`)?.classList.toggle('active', t===aba);
  });
  renderSidebar();
}

function renderSidebar() {
  const body = document.getElementById('sidebar-body');
  if (stab === 'comentarios') {
    renderComentariosSidebar(body);
  } else {
    renderAnotacoesSidebar(body);
  }
}

function renderComentariosSidebar(container) {
  const raiz = comentarios.filter(c => !c.parentId);
  if (!raiz.length) {
    container.innerHTML = `<div class="sc-empty">Nenhum comentário neste post ainda.</div>`;
    return;
  }
  container.innerHTML = raiz.map(c => renderScNode(c, comentarios)).join('');
}

function renderScNode(c, all, depth=0) {
  const replies = all.filter(x=>x.parentId===c.id);
  const nc = depth>0?'nested':'';
  const emoji = c.autorEmoji||'👤';
  const cor   = c.autorCor  ||'#c4952a';
  const nome  = c.autor     ||'Usuário';
  const corpo = esc(c.conteudo||'').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>');
  return `<div class="sc-node ${nc}">
    <div class="sc-bubble">
      <div class="sc-head">
        <span style="font-size:.75rem;">${emoji}</span>
        <span class="sc-autor" style="color:${cor};">${esc(nome)}</span>
        <span class="sc-tipo ct-${c.tipo||'resposta'}">${c.tipo||'resposta'}</span>
      </div>
      <div class="sc-body">${corpo}</div>
      <div class="sc-ts">${tsF(c.timestamp)}</div>
    </div>
    ${replies.map(r=>renderScNode(r,all,depth+1)).join('')}
  </div>`;
}

function renderAnotacoesSidebar(container) {
  const notas = carregarNotas();
  container.innerHTML = `
    <div style="font-family:var(--font-m);font-size:.6rem;color:var(--ghost);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px;">
      Anotações <span style="color:var(--gold);">(${notas.length})</span>
    </div>

    <!-- Composer -->
    <div id="nota-composer">
      <textarea id="nota-nova-txt" placeholder="Nova anotação… Cole um link, escreva um pensamento ou cole uma URL do YouTube para embed automático."
        style="width:100%;min-height:80px;background:#252018;border:1px solid #3d3020;border-radius:var(--r);padding:9px 10px;font-family:var(--font-b);font-size:.86rem;color:#bfb090;resize:vertical;outline:none;line-height:1.6;transition:border-color .2s;"
        onfocus="this.style.borderColor='#c4952a'" onblur="this.style.borderColor='#3d3020'"
      ></textarea>
      <button onclick="adicionarNota()" style="width:100%;margin-top:6px;background:var(--gold);color:var(--ink);border:none;border-radius:var(--r);padding:7px;font-family:var(--font-m);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .15s;" onmouseover="this.style.background='#b5882a'" onmouseout="this.style.background='var(--gold)'">+ Adicionar Anotação</button>
    </div>

    <!-- Lista de anotações -->
    <div id="notas-lista" style="margin-top:14px;display:flex;flex-direction:column;gap:8px;">
      ${notas.length === 0
        ? `<div style="color:#4a4030;font-family:var(--font-d);font-style:italic;font-size:.82rem;padding:16px 0;text-align:center;">Nenhuma anotação ainda.</div>`
        : notas.map((n, i) => renderNotaItem(n, i)).join('')
      }
    </div>`;
}

function renderNotaItem(nota, idx) {
  const isYt  = nota.tipo === 'youtube';
  const isUrl = nota.tipo === 'link';
  const ts    = nota.criadoEm ? new Date(nota.criadoEm).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  const editado = nota.editadoEm ? ' · editado' : '';

  let corpo = '';
  if (isYt && nota.embedUrl) {
    corpo = `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:4px;margin-top:6px;background:#1a1410;">
      <iframe src="${nota.embedUrl}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe>
    </div>`;
  } else if (isUrl) {
    const domain = (() => { try { return new URL(nota.texto).hostname; } catch { return nota.texto; } })();
    corpo = `<a href="${nota.texto}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:6px;margin-top:4px;padding:6px 8px;background:#1e1810;border:1px solid #3d3020;border-radius:3px;text-decoration:none;color:#9a8060;font-family:var(--font-m);font-size:.65rem;word-break:break-all;" onmouseover="this.style.borderColor='#c4952a'" onmouseout="this.style.borderColor='#3d3020'">🔗 ${domain}</a>`;
  } else {
    // texto simples — converte URLs em links
    const htmlTexto = escHtml(nota.texto).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#9a8060;text-decoration:underline;">$1</a>');
    corpo = `<div style="font-family:var(--font-b);font-size:.88rem;color:#bfb090;line-height:1.6;margin-top:4px;word-break:break-word;">${htmlTexto}</div>`;
  }

  return `<div class="nota-item" id="nota-${idx}" style="background:#252018;border:1px solid #3d3020;border-radius:5px;padding:10px 11px;position:relative;transition:border-color .15s;" onmouseover="this.style.borderColor='#5a4a30'" onmouseout="this.style.borderColor='#3d3020'">
    ${corpo}
    <div style="display:flex;align-items:center;gap:6px;margin-top:7px;border-top:1px solid #3d3020;padding-top:6px;">
      <span style="font-family:var(--font-m);font-size:.55rem;color:#4a4030;flex:1;">${ts}${editado}</span>
      <button onclick="editarNota(${idx})" style="background:transparent;border:1px solid #3d3020;border-radius:3px;color:#5a4d3a;font-size:.6rem;padding:2px 7px;cursor:pointer;font-family:var(--font-m);" onmouseover="this.style.color='var(--gold)';this.style.borderColor='var(--gold)'" onmouseout="this.style.color='#5a4d3a';this.style.borderColor='#3d3020'">✏ Editar</button>
      <button onclick="excluirNota(${idx})" style="background:transparent;border:1px solid #3d3020;border-radius:3px;color:#5a4d3a;font-size:.6rem;padding:2px 7px;cursor:pointer;font-family:var(--font-m);" onmouseover="this.style.color='#bf6a6a';this.style.borderColor='#bf6a6a'" onmouseout="this.style.color='#5a4d3a';this.style.borderColor='#3d3020'">🗑 Excluir</button>
    </div>
    <div class="nota-edit-form" id="nota-edit-${idx}" style="display:none;margin-top:8px;border-top:1px solid #3d3020;padding-top:8px;">
      <textarea style="width:100%;min-height:64px;background:#1e1810;border:1px solid #4a3d2a;border-radius:3px;padding:7px 9px;font-family:var(--font-b);font-size:.85rem;color:#bfb090;resize:vertical;outline:none;">${nota.texto}</textarea>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <button onclick="salvarEdicaoNota(${idx}, this)" style="flex:1;background:var(--sage);color:var(--paper);border:none;border-radius:3px;padding:5px;font-family:var(--font-m);font-size:.62rem;cursor:pointer;">✓ Salvar</button>
        <button onclick="cancelarEdicaoNota(${idx})" style="flex:1;background:transparent;border:1px solid #4a3d2a;color:#7a6a50;border-radius:3px;padding:5px;font-family:var(--font-m);font-size:.62rem;cursor:pointer;">✕ Cancelar</button>
      </div>
    </div>
  </div>`;
}

/* ── Storage de notas ── */
function carregarNotas() {
  try { return JSON.parse(localStorage.getItem(`st-notas2-${postId}`) || '[]'); }
  catch { return []; }
}
function salvarNotasStorage(lista) {
  localStorage.setItem(`st-notas2-${postId}`, JSON.stringify(lista));
}

/* ── CRUD de notas ── */
function adicionarNota() {
  const ta  = document.getElementById('nota-nova-txt');
  const txt = ta.value.trim();
  if (!txt) return;

  const notas = carregarNotas();
  const nota  = { texto: txt, criadoEm: new Date().toISOString(), tipo: 'texto' };

  // Detecta YouTube
  const ytEmbed = youtubeEmbedUrl(txt);
  if (ytEmbed) { nota.tipo = 'youtube'; nota.embedUrl = ytEmbed; }
  // Detecta URL simples
  else if (/^https?:\/\//.test(txt)) { nota.tipo = 'link'; }

  notas.unshift(nota);
  salvarNotasStorage(notas);
  ta.value = '';
  renderSidebar();
}

function editarNota(idx) {
  document.getElementById(`nota-edit-${idx}`).style.display = 'block';
}

function cancelarEdicaoNota(idx) {
  document.getElementById(`nota-edit-${idx}`).style.display = 'none';
}

function salvarEdicaoNota(idx, btn) {
  const form = document.getElementById(`nota-edit-${idx}`);
  const novoTxt = form.querySelector('textarea').value.trim();
  if (!novoTxt) return;
  const notas = carregarNotas();
  notas[idx].texto     = novoTxt;
  notas[idx].editadoEm = new Date().toISOString();
  // Re-detecta tipo
  const ytEmbed = youtubeEmbedUrl(novoTxt);
  if (ytEmbed) { notas[idx].tipo = 'youtube'; notas[idx].embedUrl = ytEmbed; }
  else if (/^https?:\/\//.test(novoTxt)) { notas[idx].tipo = 'link'; delete notas[idx].embedUrl; }
  else { notas[idx].tipo = 'texto'; delete notas[idx].embedUrl; }
  salvarNotasStorage(notas);
  renderSidebar();
}

function excluirNota(idx) {
  if (!confirm('Excluir esta anotação?')) return;
  const notas = carregarNotas();
  notas.splice(idx, 1);
  salvarNotasStorage(notas);
  renderSidebar();
}

function youtubeEmbedUrl(url) {
  let id = null;
  if (url.includes('youtube.com/watch?v=')) { try { id = new URLSearchParams(url.split('?')[1]).get('v'); } catch {} }
  else if (url.includes('youtu.be/'))       id = url.split('youtu.be/')[1]?.split('?')[0];
  else if (url.includes('youtube.com/embed/')) id = url.split('/embed/')[1]?.split('?')[0];
  return id ? `https://www.youtube.com/embed/${id}?rel=0` : null;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

/* ════════════════════════════════════════
   EXPORTAR MARKDOWN
════════════════════════════════════════ */
function exportarMarkdown() {
  blocos = coletarBlocos();
  const lines = [];
  if (postData) lines.push(`> **Post original:** ${postData.conteudo}\n`);
  lines.push('---\n');

  blocos.forEach(b => {
    const txt = b.conteudo.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
    switch(b.tipo) {
      case 'h1':      lines.push(`# ${txt}`); break;
      case 'h2':      lines.push(`## ${txt}`); break;
      case 'h3':      lines.push(`### ${txt}`); break;
      case 'bullet':  lines.push(`- ${txt}`); break;
      case 'num':     lines.push(`1. ${txt}`); break;
      case 'quote':   lines.push(`> ${txt}`); break;
      case 'callout': lines.push(`> 💡 ${txt}`); break;
      case 'code':    lines.push('```\n' + txt + '\n```'); break;
      case 'divider': lines.push('---'); break;
      case 'youtube': lines.push(`[▶ Vídeo YouTube](${b.conteudo})`); break;
      case 'link':    lines.push(`[🔗 Link](${b.conteudo})`); break;
      default:        if (txt) lines.push(txt);
    }
    lines.push('');
  });

  const md    = lines.join('\n');
  const blob  = new Blob([md], { type:'text/markdown' });
  const a     = document.createElement('a');
  a.href      = URL.createObjectURL(blob);
  a.download  = `aprofundamento-${postId}.md`;
  a.click();
}
