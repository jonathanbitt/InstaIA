<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca de Estudos 📚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo:#7C4DFF;
    --roxo-claro:#B388FF;
    --rosa:#FF5C8A;
    --laranja:#FFA94D;
    --verde:#4CD964;
    --azul:#4DA6FF;
    --bg:#F4F1FF;
    --texto:#3A2E5C;
    --branco:#FFFFFF;
    --erro:#FF5C5C;
    --sombra: 0 8px 24px rgba(124,77,255,0.18);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Nunito', sans-serif;
    background: linear-gradient(160deg, #EFE9FF 0%, #FFE9F2 50%, #FFF3E0 100%);
    color: var(--texto);
    min-height:100vh;
    padding-bottom: 40px;
  }

  h1, h2, h3, .titulo-font{
    font-family:'Fredoka One', cursive;
  }

  /* ===== HEADER ===== */
  header{
    text-align:center;
    padding: 28px 16px 18px;
  }
  header h1{
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    color: var(--roxo);
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  }
  header p{
    margin-top:8px;
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    font-weight:600;
    color: #6B5B95;
  }

  .container{
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ===== CARDS DE MATÉRIAS ===== */
  #tela-inicial .grid-materias{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .card-materia{
    background: var(--branco);
    border-radius: 22px;
    padding: 24px 20px;
    box-shadow: var(--sombra);
    cursor:pointer;
    text-align:center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    border: 3px solid transparent;
    position:relative;
    overflow:hidden;
  }
  .card-materia::before{
    content:"";
    position:absolute;
    top:-50%; right:-50%;
    width:140%; height:140%;
    background: linear-gradient(135deg, var(--roxo-claro), transparent 60%);
    opacity:0.12;
    transform: rotate(15deg);
    pointer-events:none;
  }
  .card-materia:hover{
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 14px 30px rgba(124,77,255,0.28);
    border-color: var(--roxo-claro);
  }
  .card-materia .icone-grande{
    font-size: 3rem;
    display:block;
    margin-bottom: 10px;
  }
  .card-materia h3{
    color: var(--roxo);
    font-size: 1.25rem;
    margin-bottom: 8px;
  }
  .card-materia p{
    font-size: 0.95rem;
    color: #6B5B95;
    line-height:1.4;
  }
  .card-materia .botao-entrar{
    display:inline-block;
    margin-top:14px;
    padding: 8px 20px;
    border-radius: 999px;
    background: var(--rosa);
    color:#fff;
    font-weight:800;
    font-size:0.9rem;
  }

  /* ===== BARRA DE PROGRESSO ===== */
  .barra-progresso-wrap{
    margin: 18px 0 6px;
  }
  .barra-progresso-info{
    display:flex;
    justify-content:space-between;
    font-weight:800;
    font-size:0.9rem;
    color: var(--roxo);
    margin-bottom:6px;
  }
  .barra-progresso{
    width:100%;
    height: 16px;
    background: #E4DBFF;
    border-radius: 999px;
    overflow:hidden;
  }
  .barra-progresso-fill{
    height:100%;
    width:0%;
    background: linear-gradient(90deg, var(--roxo), var(--rosa), var(--laranja));
    border-radius: 999px;
    transition: width 0.4s ease;
  }

  .contadores{
    display:flex;
    gap: 12px;
    margin: 12px 0 4px;
    flex-wrap:wrap;
  }
  .pill{
    padding: 6px 14px;
    border-radius: 999px;
    font-weight:800;
    font-size: 0.9rem;
    color:#fff;
  }
  .pill.acertos{ background: var(--verde); }
  .pill.erros{ background: var(--erro); }
  .pill.licao{ background: var(--azul); }

  /* ===== CARD DA LIÇÃO ===== */
  .card-licao{
    background: var(--branco);
    border-radius: 24px;
    padding: 24px;
    margin-top: 16px;
    box-shadow: var(--sombra);
    animation: entrar 0.4s ease;
  }
  @keyframes entrar{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card-licao h2{
    color: var(--roxo);
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    margin-bottom: 14px;
  }

  .secao{
    margin-bottom: 16px;
    padding: 14px 16px;
    border-radius: 16px;
    line-height:1.6;
    font-size: 1.02rem;
  }
  .secao-explicacao{ background:#F1ECFF; border-left: 6px solid var(--roxo); }
  .secao-exemplo{ background:#E6F7FF; border-left: 6px solid var(--azul); }
  .secao-dica{ background:#FFF3E0; border-left: 6px solid var(--laranja); }

  .secao strong.rotulo{
    display:block;
    font-family:'Fredoka One', cursive;
    margin-bottom:6px;
    font-size: 1rem;
  }
  .secao-explicacao .rotulo{ color: var(--roxo); }
  .secao-exemplo .rotulo{ color: #1F8FE0; }
  .secao-dica .rotulo{ color: #E08A00; }

  .pergunta-box{
    margin-top: 20px;
    padding: 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, #FFF, #F8F5FF);
    border: 2px dashed var(--roxo-claro);
  }
  .pergunta-box h3{
    color: var(--rosa);
    font-size: 1.15rem;
    margin-bottom: 12px;
  }

  .opcoes{
    display:flex;
    flex-direction:column;
    gap: 12px;
    margin-top: 10px;
  }
  .opcao{
    text-align:left;
    width:100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 2px solid #E0D6FF;
    background: #fff;
    font-size: 1rem;
    font-weight:700;
    font-family:'Nunito', sans-serif;
    color: var(--texto);
    cursor:pointer;
    transition: all 0.18s ease;
  }
  .opcao:hover:not(:disabled){
    border-color: var(--roxo);
    background:#F6F1FF;
    transform: translateX(4px);
  }
  .opcao:disabled{ cursor:default; }
  .opcao.correta{
    border-color: var(--verde);
    background: #E8FCEF;
    color:#1E8E3E;
  }
  .opcao.errada{
    border-color: var(--erro);
    background: #FFEDED;
    color:#C62828;
  }

  .feedback{
    margin-top: 16px;
    padding: 16px;
    border-radius: 16px;
    font-weight:700;
    line-height:1.6;
    animation: pop 0.35s ease;
    display:none;
  }
  @keyframes pop{
    from{ transform: scale(0.95); opacity:0; }
    to{ transform: scale(1); opacity:1; }
  }
  .feedback.show{ display:block; }
  .feedback.acerto{ background:#E8FCEF; border:3px solid var(--verde); color:#1E8E3E; }
  .feedback.erro{ background:#FFEDED; border:3px solid var(--erro); color:#C62828; }
  .feedback .titulo-feedback{
    font-family:'Fredoka One', cursive;
    font-size: 1.15rem;
    margin-bottom: 8px;
    display:block;
  }

  /* ===== BOTÕES GERAIS ===== */
  .acoes{
    display:flex;
    justify-content:space-between;
    gap: 12px;
    margin-top: 22px;
    flex-wrap:wrap;
  }
  .btn{
    flex:1;
    min-width: 140px;
    padding: 14px 18px;
    border:none;
    border-radius: 16px;
    font-family:'Fredoka One', cursive;
    font-size: 1rem;
    color:#fff;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
  }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-primario{ background: linear-gradient(135deg, var(--roxo), var(--rosa)); }
  .btn-secundario{ background: linear-gradient(135deg, var(--azul), #6FE3D6); }
  .btn-voltar{ background: linear-gradient(135deg, #B0B0C0, #8A8AA0); }
  .btn-laranja{ background: linear-gradient(135deg, var(--laranja), #FF7A7A); }

  /* ===== TELA DE RESULTADO ===== */
  #tela-resultado{
    text-align:center;
  }
  .resultado-card{
    background: var(--branco);
    border-radius: 24px;
    padding: 30px 22px;
    box-shadow: var(--sombra);
    margin-top: 16px;
    animation: entrar 0.5s ease;
  }
  .resultado-emoji{
    font-size: 4rem;
    display:block;
    margin-bottom: 8px;
  }
  .resultado-card h2{
    color: var(--roxo);
    font-size: clamp(1.4rem, 5vw, 2rem);
    margin-bottom: 6px;
  }
  .resultado-mensagem{
    font-size: 1.05rem;
    font-weight:700;
    color:#6B5B95;
    margin-bottom: 18px;
  }
  .resultado-stats{
    display:flex;
    justify-content:center;
    gap: 14px;
    flex-wrap:wrap;
    margin-bottom: 18px;
  }
  .stat-box{
    background: #F4F1FF;
    border-radius: 16px;
    padding: 14px 22px;
    min-width: 100px;
  }
  .stat-box .num{
    font-family:'Fredoka One', cursive;
    font-size: 1.6rem;
    color: var(--roxo);
    display:block;
  }
  .stat-box .label{
    font-size:0.85rem;
    font-weight:700;
    color:#6B5B95;
  }

  .lista-revisao{
    text-align:left;
    margin-top: 8px;
  }
  .lista-revisao h3{
    color: var(--rosa);
    margin-bottom: 12px;
    font-size: 1.1rem;
  }
  .item-revisao{
    background: #FFF6F6;
    border: 2px solid #FFD6D6;
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-size: 0.95rem;
    line-height:1.5;
  }
  .item-revisao .pergunta-txt{
    font-weight:800;
    color: var(--texto);
    margin-bottom: 4px;
  }
  .item-revisao .resposta-aluno{
    color:#C62828;
  }
  .item-revisao .resposta-certa{
    color:#1E8E3E;
  }
  .item-revisao .explicacao-txt{
    margin-top:6px;
    color:#6B5B95;
    font-style:italic;
  }
  .sem-erros{
    text-align:center;
    font-weight:800;
    color: var(--verde);
    font-size: 1.05rem;
    padding: 14px;
  }

  /* ===== UTIL ===== */
  .escondido{ display:none !important; }
  .carregando{
    text-align:center;
    padding: 40px 16px;
    font-weight:800;
    color: var(--roxo);
    font-size: 1.1rem;
  }
  .topo-licao{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
  }
  .topo-licao .titulo-materia-atual{
    font-size: 0.95rem;
    font-weight:800;
    color: var(--azul);
  }

  /* ===== CONFETES ===== */
  .confete{
    position: fixed;
    top: -20px;
    width: 10px;
    height: 16px;
    opacity: 0.9;
    z-index: 999;
    border-radius: 2px;
    animation: cair linear forwards;
  }
  @keyframes cair{
    to{
      transform: translateY(110vh) rotate(540deg);
      opacity: 0.4;
    }
  }

  @media (max-width: 480px){
    .acoes{ flex-direction:column; }
    .btn{ width:100%; }
  }
</style>
</head>
<body>

<header>
  <h1 id="titulo-principal">📚 Biblioteca de Estudos</h1>
  <p id="subtitulo-principal">Aprenda com explicações e pratique com exercícios</p>
</header>

<div class="container">

  <!-- TELA INICIAL -->
  <section id="tela-inicial">
    <div class="grid-materias" id="grid-materias">
      <div class="carregando">Carregando matérias... ⏳</div>
    </div>
  </section>

  <!-- TELA DE LIÇÃO -->
  <section id="tela-licao" class="escondido">
    <div class="barra-progresso-wrap">
      <div class="barra-progresso-info">
        <span id="texto-progresso">Lição 1 de 10</span>
        <span id="titulo-materia-topo" class="titulo-materia-atual"></span>
      </div>
      <div class="barra-progresso">
        <div class="barra-progresso-fill" id="barra-fill"></div>
      </div>
    </div>

    <div class="contadores">
      <span class="pill acertos">✅ Acertos: <span id="num-acertos">0</span></span>
      <span class="pill erros">❌ Erros: <span id="num-erros">0</span></span>
      <span class="pill licao">📖 Lição: <span id="num-licao-atual">1</span>/<span id="num-total-licoes">10</span></span>
    </div>

    <div class="card-licao" id="card-licao">
      <!-- conteúdo gerado via JS -->
    </div>

    <div class="acoes">
      <button class="btn btn-voltar" id="btn-voltar-menu">⬅️ Voltar ao Menu</button>
      <button class="btn btn-primario" id="btn-proxima" disabled>Próxima Lição ➡️</button>
    </div>
  </section>

  <!-- TELA DE RESULTADO -->
  <section id="tela-resultado" class="escondido">
    <div class="resultado-card">
      <span class="resultado-emoji" id="resultado-emoji">🎉</span>
      <h2 id="resultado-titulo">Resultado Final</h2>
      <p class="resultado-mensagem" id="resultado-mensagem"></p>

      <div class="resultado-stats">
        <div class="stat-box">
          <span class="num" id="res-acertos">0</span>
          <span class="label">Acertos ✅</span>
        </div>
        <div class="stat-box">
          <span class="num" id="res-erros">0</span>
          <span class="label">Erros ❌</span>
        </div>
        <div class="stat-box">
          <span class="num" id="res-porcentagem">0%</span>
          <span class="label">Aproveitamento</span>
        </div>
      </div>

      <div class="lista-revisao" id="lista-revisao"></div>

      <div class="acoes">
        <button class="btn btn-laranja" id="btn-refazer">🔄 Refazer Prova</button>
        <button class="btn btn-secundario" id="btn-menu-final">🏠 Voltar ao Menu</button>
      </div>
    </div>
  </section>

</div>

<script>
/* =====================================================
   DADOS DE FALLBACK (caso o fetch dos JSONs falhe)
   ===================================================== */
const FALLBACK_INDEX = {
  "titulo": "📚 Biblioteca de Estudos",
  "subtitulo": "Aprenda com explicações e pratique com exercícios",
  "materias": [
    {
      "id": "obmep_4ano",
      "nome": "🏆 OBMEP - 4º Ano",
      "descricao": "Sequências, lógica, contagem e desafios olímpicos",
      "icone": "🏅",
      "arquivo": "./data/obmep_4ano.json"
    }
  ]
};

const FALLBACK_OBMEP = {
  "icone": "🏅",
  "titulo_materia": "🏆 OBMEP - Matemática 4º Ano",
  "aulas": [
    {
      "titulo": "Sequências Numéricas",
      "explicacao": "Uma sequência numérica é uma fila de números que segue sempre a mesma regra! 🧠 Pode ser uma regra de somar sempre o mesmo número, dobrar, ou diminuir sempre a mesma quantidade. Para descobrir a regra, é só olhar a diferença entre um número e o número seguinte.",
      "dica": "💡 Pegue dois números vizinhos da sequência e veja o que precisa fazer para ir de um para o outro (somar, subtrair, dobrar...). Essa é a regra escondida!",
      "exemplo": "Veja a sequência 2, 4, 6, 8... Da primeira para a segunda foi +2. Da segunda para a terceira também foi +2. Ou seja, a regra é 'somar 2'. Então o próximo número depois do 8 é 8 + 2 = 10.",
      "pergunta": "Qual é o próximo número da sequência: 3, 6, 9, 12, ___?",
      "opcoes": ["14", "15", "16", "18"],
      "resposta": "15",
      "explicacao_resposta": "A regra dessa sequência é 'somar 3' a cada passo: 3 → 6 (+3) → 9 (+3) → 12 (+3). Então o próximo número é 12 + 3 = 15. ⭐"
    },
    {
      "titulo": "Comparando Quantidades",
      "explicacao": "Quando comparamos números, queremos saber qual é maior, qual é menor ou se são iguais. 🎯 Para isso, podemos colocar todos os números em ordem, do menor para o maior (ou do maior para o menor), e assim fica fácil ver quem está na frente e quem está atrás.",
      "dica": "💡 Escreva todos os números numa fila e organize-os do menor para o maior. O primeiro da fila é o menor de todos!",
      "exemplo": "Ana tem 8 balas, Bia tem 5 balas e Carlos tem 12 balas. Colocando em ordem: 5, 8, 12. Como 5 é o menor número, Bia é quem tem MENOS balas.",
      "pergunta": "Pedro tem 15 figurinhas, Lucas tem 9, Marina tem 21 e Tomás tem 17. Quem tem MENOS figurinhas?",
      "opcoes": ["Pedro", "Lucas", "Marina", "Tomás"],
      "resposta": "Lucas",
      "explicacao_resposta": "Colocando as quantidades em ordem: 9, 15, 17, 21. O menor número é 9, que é a quantidade de figurinhas do Lucas. Por isso, ele tem menos figurinhas que todo mundo. 📚"
    },
    {
      "titulo": "Contando Combinações",
      "explicacao": "Às vezes precisamos descobrir de quantas formas diferentes podemos combinar coisas, como roupas, sabores ou cores. 🧩 Para isso, existe um truque muito útil: basta multiplicar a quantidade de opções de cada grupo!",
      "dica": "💡 Multiplique a quantidade de itens do primeiro grupo pela quantidade de itens do segundo grupo. O resultado é o total de combinações possíveis.",

      "opcoes": ["7", "9", "10", "12"],
      "resposta": "12",
      "explicacao_resposta": "Para descobrir o total de combinações, multiplicamos a quantidade de blusas pela quantidade de shorts: 3 x 4 = 12. Maria pode montar 12 looks diferentes! 🎯"
    },
    {
      "titulo": "Somando e Subtraindo no Dia a Dia",
      "explicacao": "Muitos problemas do nosso dia a dia envolvem mais de uma operação. Pode ser que primeiro precisemos subtrair algo (porque gastamos ou perdemos) e depois somar outra coisa (porque ganhamos ou recebemos). 💰 O segredo é fazer as contas na ordem certa, uma de cada vez.",
      "dica": "💡 Leia o problema com calma e escreva as contas na ordem em que as coisas acontecem na história. Resolva uma conta por vez, sem pressa.",

      "opcoes": ["R$22", "R$32", "R$58", "R$68"],
      "resposta": "R$32",
      "explicacao_resposta": "Primeiro fazemos a subtração: 45 - 23 = 22 (depois de comprar o livro). Depois somamos o presente da vovó: 22 + 10 = 32. Beatriz ficou com R$32. 💡"

    {
      "titulo": "Fração de uma Quantidade",
      "explicacao": "Uma fração mostra como dividir algo em partes iguais e pegar uma certa quantidade dessas partes. 🍕 O número de baixo (denominador) diz em quantas partes iguais devemos dividir o total. O número de cima (numerador) diz quantas dessas partes nós vamos pegar.",

/* Mapa de fallback por id de matéria, para crescer no futuro */
const FALLBACK_MATERIAS = {
  "obmep_4ano": FALLBACK_OBMEP
};

/* =====================================================
   ESTADO DA APLICAÇÃO
   ===================================================== */
const estado = {
  materiaAtual: null,   // dados do JSON da matéria
  licaoIndex: 0,
  acertos: 0,
  erros: 0,
  respondidoAtual: false,
  historico: []         // { pergunta, opcoes, respostaCerta, respostaAluno, correta, explicacao }
};

/* Elementos */
const telaInicial = document.getElementById('tela-inicial');
const telaLicao = document.getElementById('tela-licao');
const telaResultado = document.getElementById('tela-resultado');
const gridMaterias = document.getElementById('grid-materias');

/* =====================================================
   CARREGAR TELA INICIAL
   ===================================================== */
async function carregarIndex(){
  let dados;
  try{
    const resp = await fetch('./data/index.json');
    if(!resp.ok) throw new Error('Falha ao buscar index.json');
    dados = await resp.json();
  }catch(e){
    console.warn('Usando dados de fallback para index.json', e);
    dados = FALLBACK_INDEX;
  }

  document.getElementById('titulo-principal').textContent = dados.titulo || '📚 Biblioteca de Estudos';
  document.getElementById('subtitulo-principal').textContent = dados.subtitulo || '';

  gridMaterias.innerHTML = '';
  (dados.materias || []).forEach(materia => {
    const card = document.createElement('div');
    card.className = 'card-materia';
    card.innerHTML = `
      <span class="icone-grande">${materia.icone || '📘'}</span>
      <h3>${materia.nome}</h3>
      <p>${materia.descricao || ''}</p>
      <span class="botao-entrar">Começar 🚀</span>
    `;
    card.addEventListener('click', () => abrirMateria(materia));
    gridMaterias.appendChild(card);
  });
}

/* =====================================================
   ABRIR UMA MATÉRIA (carrega o JSON correspondente)
   ===================================================== */
async function abrirMateria(materia){
  gridMaterias.innerHTML = '<div class="carregando">Preparando suas lições... 🎒</div>';

  let dados;
  try{
    const resp = await fetch(materia.arquivo);
    if(!resp.ok) throw new Error('Falha ao buscar ' + materia.arquivo);
    dados = await resp.json();
  }catch(e){
    console.warn('Usando dados de fallback para a matéria', materia.id, e);
    dados = FALLBACK_MATERIAS[materia.id] || FALLBACK_OBMEP;
  }

  estado.materiaAtual = dados;
  estado.licaoIndex = 0;
  estado.acertos = 0;
  estado.erros = 0;
  estado.historico = [];

  document.getElementById('num-total-licoes').textContent = dados.aulas.length;
  document.getElementById('titulo-materia-topo').textContent = dados.titulo_materia || '';

  telaInicial.classList.add('escondido');
  telaResultado.classList.add('escondido');
  telaLicao.classList.remove('escondido');

  // Re-renderiza o grid (para quando voltar ao menu)
  carregarIndex();
  renderLicao();
}

/* =====================================================
   RENDERIZAR LIÇÃO ATUAL
   ===================================================== */
function renderLicao(){
  const aulas = estado.materiaAtual.aulas;
  const aula = aulas[estado.licaoIndex];
  estado.respondidoAtual = false;

  // Progresso
  const total = aulas.length;
  const atual = estado.licaoIndex + 1;
  document.getElementById('texto-progresso').textContent = `Lição ${atual} de ${total}`;
  document.getElementById('num-licao-atual').textContent = atual;
  document.getElementById('num-total-licoes').textContent = total;
  const porcentagemBarra = (estado.licaoIndex / total) * 100;
  document.getElementById('barra-fill').style.width = porcentagemBarra + '%';

  // Contadores
  document.getElementById('num-acertos').textContent = estado.acertos;
  document.getElementById('num-erros').textContent = estado.erros;

  // Card da lição
  const card = document.getElementById('card-licao');
  card.innerHTML = `
    <h2>${aula.titulo}</h2>

    <div class="secao secao-explicacao">
      <strong class="rotulo">🧠 Explicação</strong>
      ${aula.explicacao}
    </div>

    <div class="secao secao-exemplo">
      <strong class="rotulo">📚 Exemplo</strong>
      ${aula.exemplo}
    </div>

    <div class="secao secao-dica">
      <strong class="rotulo">💡 Dica</strong>
      ${aula.dica}
    </div>

    <div class="pergunta-box">
      <h3>🎯 Hora de praticar!</h3>
      <p>${aula.pergunta}</p>
      <div class="opcoes" id="lista-opcoes"></div>
      <div class="feedback" id="feedback-box"></div>
    </div>
  `;

  // Opções
  const listaOpcoes = document.getElementById('lista-opcoes');
  aula.opcoes.forEach(opcao => {
    const btn = document.createElement('button');
    btn.className = 'opcao';
    btn.textContent = opcao;
    btn.addEventListener('click', () => responder(opcao, aula));
    listaOpcoes.appendChild(btn);
  });

  // Botão próxima
  const btnProxima = document.getElementById('btn-proxima');
  btnProxima.disabled = true;
  btnProxima.textContent = (estado.licaoIndex === aulas.length - 1) ? 'Ver Resultado 🏆' : 'Próxima Lição ➡️';
}

/* =====================================================
   RESPONDER PERGUNTA
   ===================================================== */
function responder(opcaoEscolhida, aula){
  if(estado.respondidoAtual) return;
  estado.respondidoAtual = true;

  const botoes = document.querySelectorAll('#lista-opcoes .opcao');
  const correta = opcaoEscolhida === aula.resposta;

  botoes.forEach(btn => {
    btn.disabled = true;
    if(btn.textContent === aula.resposta){
      btn.classList.add('correta');
    }
    if(btn.textContent === opcaoEscolhida && !correta){
      btn.classList.add('errada');
    }
  });

  const feedback = document.getElementById('feedback-box');
  feedback.classList.add('show');

  if(correta){
    estado.acertos++;
    feedback.classList.add('acerto');
    feedback.classList.remove('erro');
    feedback.innerHTML = `
      <span class="titulo-feedback">✅ Isso mesmo! Você acertou!</span>
      ${aula.explicacao_resposta}
    `;
  }else{
    estado.erros++;
    feedback.classList.add('erro');
    feedback.classList.remove('acerto');
    feedback.innerHTML = `
      <span class="titulo-feedback">❌ Quase! A resposta certa é "${aula.resposta}"</span>
      ${aula.explicacao_resposta}
    `;
  }

  document.getElementById('num-acertos').textContent = estado.acertos;
  document.getElementById('num-erros').textContent = estado.erros;

  // Salva no histórico
  estado.historico.push({
    titulo: aula.titulo,
    pergunta: aula.pergunta,
    respostaCerta: aula.resposta,
    respostaAluno: opcaoEscolhida,
    correta: correta,
    explicacao: aula.explicacao_resposta
  });

  document.getElementById('btn-proxima').disabled = false;
}

/* =====================================================
   NAVEGAÇÃO ENTRE LIÇÕES
   ===================================================== */
document.getElementById('btn-proxima').addEventListener('click', () => {
  const aulas = estado.materiaAtual.aulas;
  if(estado.licaoIndex < aulas.length - 1){
    estado.licaoIndex++;
    renderLicao();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }else{
    mostrarResultado();
  }
});

document.getElementById('btn-voltar-menu').addEventListener('click', voltarAoMenu);
document.getElementById('btn-menu-final').addEventListener('click', voltarAoMenu);

function voltarAoMenu(){
  telaLicao.classList.add('escondido');
  telaResultado.classList.add('escondido');
  telaInicial.classList.remove('escondido');
  carregarIndex();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* =====================================================
   TELA DE RESULTADO
   ===================================================== */
function mostrarResultado(){
  const total = estado.materiaAtual.aulas.length;
  const porcentagem = Math.round((estado.acertos / total) * 100);

  telaLicao.classList.add('escondido');
  telaResultado.classList.remove('escondido');

  // Atualiza barra de progresso para 100% (mesmo que ela não esteja visível agora)
  document.getElementById('barra-fill').style.width = '100%';

  document.getElementById('res-acertos').textContent = estado.acertos;
  document.getElementById('res-erros').textContent = estado.erros;
  document.getElementById('res-porcentagem').textContent = porcentagem + '%';

  // Emoji e mensagem baseados no desempenho
  let emoji, titulo, mensagem;
  if(porcentagem === 100){
    emoji = '🏆🌟';
    titulo = 'Nota Máxima!';
    mensagem = 'Incrível! Você acertou TODAS as questões! Você é um campeão da matemática! 🎉';
  }else if(porcentagem >= 70){
    emoji = '🎉⭐';
    titulo = 'Muito bem!';
    mensagem = 'Ótimo trabalho! Você mostrou que entendeu bem o conteúdo. Continue assim! 💪';
  }else if(porcentagem >= 50){
    emoji = '🙂📚';
    titulo = 'Bom esforço!';
    mensagem = 'Você está no caminho certo! Revise as questões abaixo para ficar ainda mais forte. 💡';
  }else{
    emoji = '🌱💡';
    titulo = 'Continue Praticando!';
    mensagem = 'Toda jornada tem seus desafios! Revise as explicações abaixo e tente de novo — você vai melhorar! 🚀';
  }

  document.getElementById('resultado-emoji').textContent = emoji;
  document.getElementById('resultado-titulo').textContent = titulo;
  document.getElementById('resultado-mensagem').textContent = mensagem;

  // Lista de revisão (apenas erros)
  const lista = document.getElementById('lista-revisao');
  const erros = estado.historico.filter(item => !item.correta);

  if(erros.length === 0){
    lista.innerHTML = '<div class="sem-erros">🌟 Você não errou nenhuma questão! Parabéns! 🌟</div>';
  }else{
    let html = '<h3>📝 Questões para revisar:</h3>';
    erros.forEach(item => {
      html += `
        <div class="item-revisao">
          <div class="pergunta-txt">${item.titulo}: ${item.pergunta}</div>
          <div class="resposta-aluno">Sua resposta: ${item.respostaAluno}</div>
          <div class="resposta-certa">Resposta correta: ${item.respostaCerta}</div>
          <div class="explicacao-txt">${item.explicacao}</div>
        </div>
      `;
    });
    lista.innerHTML = html;
  }

  // Confetes se desempenho >= 70%
  if(porcentagem >= 70){
    dispararConfetes();
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* Botão refazer prova */
document.getElementById('btn-refazer').addEventListener('click', () => {
  estado.licaoIndex = 0;
  estado.acertos = 0;
  estado.erros = 0;
  estado.historico = [];

  telaResultado.classList.add('escondido');
  telaLicao.classList.remove('escondido');
  renderLicao();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* =====================================================
   CONFETES 🎉
   ===================================================== */
function dispararConfetes(){
  const cores = ['#7C4DFF', '#FF5C8A', '#FFA94D', '#4CD964', '#4DA6FF', '#FFD54F'];
  const quantidade = 80;

  for(let i = 0; i < quantidade; i++){
    const confete = document.createElement('div');
    confete.className = 'confete';
    confete.style.left = Math.random() * 100 + 'vw';
    confete.style.background = cores[Math.floor(Math.random() * cores.length)];
    confete.style.animationDuration = (2.5 + Math.random() * 2) + 's';
    confete.style.animationDelay = (Math.random() * 1.5) + 's';
    confete.style.width = (6 + Math.random() * 8) + 'px';
    confete.style.height = (10 + Math.random() * 10) + 'px';
    document.body.appendChild(confete);

    setTimeout(() => confete.remove(), 5000);
  }
}

/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */
carregarIndex();
</script>
